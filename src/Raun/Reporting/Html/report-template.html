    --ink:#1b2027; --muted:#5b636e; --faint:#8b929c;
    --pass:#1a9c50; --fail:#d23636; --skip:#9a6b0c;
    --pass-text:#15803d; --fail-text:#b91c1c; --skip-text:#8a5e0a;
    --pass-bg:#e4f5ea; --fail-bg:#fbe8e8; --skip-bg:#f6edd6;
    --bar-pass:#22a35a; --bar-fail:#dc3b3b; --bar-skip:#a7740f; --bar-text:#ffffff;
    --ph-given:#2f74d0; --ph-when:#8350c4; --ph-then:#0c8576;
    --ph-given-ink:#2562c2; --ph-when-ink:#7237bd; --ph-then-ink:#0a7567;
    --v-create:#2563eb; --v-read:#0d9488; --v-edit:#e07a14; --v-delete:#9333ea;
    --accent:#3b62e8;
    --shadow:0 1px 2px rgba(17,24,39,.06), 0 6px 16px rgba(17,24,39,.06);
    --shadow-sm:0 1px 2px rgba(17,24,39,.07);
    --ad-panel:#ffffff; --ad-cell:#eef1f5; --ad-cell-row:#e4e8ee; --ad-wall:#aab2bd;
    --ad-control:#8b929c; --ad-grid:#d8dde4; --ad-card:#ffffff; --ad-card-border:#d0d7de;
    --ad-card-ink:#1f2328; --ad-grey:#aab2bd; --ad-grey-badge:#8b93a0; --ad-band-op:.09;
    --sheen:#bcd4ff; --sheen-peak:.14; --edge:#ffffff; --edge-peak:.48;
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300; --cat-7:#9085e9; --cat-8:#e66767;
    --bg:#0d1117; --bg-grad:#0b0f14;
    --surface:#161b22; --surface-2:#1b2230; --inset:#10151d;
    --border:#2a313c; --border-strong:#39414e;
    --ink:#e6edf3; --muted:#9aa4b0; --faint:#6c7682;
    --pass:#3fb950; --fail:#f0524a; --skip:#d4a13a;
    --pass-text:#56d364; --fail-text:#ff7b72; --skip-text:#e3b341;
    --pass-bg:rgba(63,185,80,.15); --fail-bg:rgba(240,82,74,.15); --skip-bg:rgba(212,161,58,.16);
    --bar-pass:#2ea043; --bar-fail:#da3633; --bar-skip:#b9842a; --bar-text:#ffffff;
    --ph-given:#3f82e6; --ph-when:#9a6ae0; --ph-then:#1aa48d;
    --ph-given-ink:#2562c2; --ph-when-ink:#7237bd; --ph-then-ink:#0a7567;
    --v-create:#4f8bff; --v-read:#2dd4bf; --v-edit:#f59e3c; --v-delete:#c07bf0;
    --accent:#5b86ff;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --ad-panel:#0d1117; --ad-cell:#161b22; --ad-cell-row:#1a212b; --ad-wall:#5f6873;
    --ad-control:#5c6571; --ad-grid:#1d2531; --ad-card:#131922; --ad-card-border:#2a313c;
    --ad-card-ink:#e6edf3; --ad-grey:#5c6571; --ad-grey-badge:#7e8794; --ad-band-op:.065;
    --sheen:#ffffff; --sheen-peak:.06; --edge:#ffffff; --edge-peak:.5;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg, var(--bg-grad), var(--bg) 220px) fixed;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:var(--mono); }

  /* ---------- APP BAR ---------- */
  .appbar{
    max-width:1180px; margin:0 auto; padding:26px 24px 8px;
  }
  .brand{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .brand .logo{
    width:34px; height:34px; border-radius:9px; flex:none;
    background:linear-gradient(135deg, var(--accent), #7aa2ff);
    display:grid; place-items:center; color:#fff; font-weight:800; font-size:15px;
    box-shadow:var(--shadow-sm);
  }
  .brand h1{ font-size:17px; margin:0; font-weight:700; letter-spacing:-.01em; }
  .brand .sub{ font-size:12.5px; color:var(--muted); margin-top:1px; }
  .chips{ display:flex; gap:12px; flex-wrap:wrap; }
  .chip{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:13px;
    padding:11px 15px 11px 13px; box-shadow:var(--shadow-sm); min-width:118px;
  }
  .chip .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .chip .n{ font:650 21px/1 var(--mono); letter-spacing:-.02em; }
  .chip .l{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:3px; }
  .chip.pass .dot{ background:var(--pass); } .chip.pass .n{ color:var(--pass-text); }
  .chip.fail .dot{ background:var(--fail); } .chip.fail .n{ color:var(--fail-text); }
  .chip.skip .dot{ background:var(--skip); } .chip.skip .n{ color:var(--skip-text); }
  .chip.meta .n{ color:var(--ink); font-size:16px; }
  .chip.meta{ min-width:0; }

  /* ---------- PHASE LEGEND ---------- */
  .phase-legend{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:14px; }
  .phase-legend .pl-title{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
  .phase-legend .it{ display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); }
  .phase-legend b{
    width:19px; height:19px; border-radius:5px; flex:none; display:grid; place-items:center;
    color:#fff; font:700 10.5px/1 var(--mono);
    box-shadow:var(--shadow-sm); border:1px solid rgba(0,0,0,.08);
  }
  .phase-legend b.g{ background:var(--ph-given); }
  .phase-legend b.w{ background:var(--ph-when); }
  .phase-legend b.t{ background:var(--ph-then); }

  /* ---------- SCENARIO CARD ---------- */
  main{ max-width:1180px; margin:0 auto; padding:14px 24px 60px; }
  .card{
    position:relative; background:var(--surface); border:1px solid var(--border);
    border-left:4px solid var(--edge); border-radius:14px; box-shadow:var(--shadow);
    padding:16px 20px 18px; margin:16px 0;
  }
  .card.s-passed{ --edge:var(--bar-pass); }
  .card.s-failed{ --edge:var(--bar-fail); }
  .card.s-skipped{ --edge:var(--bar-skip); }

  .card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px; }
  .card-title{ min-width:0; }
  .card-title .name{ font-size:15.5px; font-weight:680; letter-spacing:-.01em; }
  .card-title .cls{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .card-title .cls .mth{ color:var(--faint); }
  .card-meta{ display:flex; align-items:center; gap:10px; flex:none; }
  .dur{ font:13px/1 var(--mono); color:var(--muted); }

  .pill{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    padding:4px 10px; border-radius:999px; white-space:nowrap;
  }
  .pill .pd{ width:7px; height:7px; border-radius:50%; }
  .pill.passed{ color:var(--pass-text); background:var(--pass-bg); } .pill.passed .pd{ background:var(--pass); }
  .pill.failed{ color:var(--fail-text); background:var(--fail-bg); } .pill.failed .pd{ background:var(--fail); }
  .pill.skipped{ color:var(--skip-text); background:var(--skip-bg); } .pill.skipped .pd{ background:var(--skip); }

  /* ---------- DRILL PANEL (scenario-level: every step in run order) ---------- */
  .drill-host{ margin-top:4px; }
  .drill{
    display:none; margin-top:12px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:11px; padding:14px 16px; box-shadow:var(--shadow-sm);
  }
  .drill.open{ display:block; }
  .step-list{ display:flex; flex-direction:column; gap:10px; }
  .step-entry{
    border:1px solid var(--border); border-left:3px solid var(--se-edge, var(--border-strong));
    border-radius:9px; background:var(--surface); padding:10px 13px 12px; scroll-margin-top:18px;
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  .step-entry.ph-given{ --se-edge:var(--ph-given); }
  .step-entry.ph-when{ --se-edge:var(--ph-when); }
  .step-entry.ph-then{ --se-edge:var(--ph-then); }
  .step-entry.status-failed{ --se-edge:var(--bar-fail); }
  .step-entry.status-skipped{ --se-edge:var(--bar-skip); }
  .step-entry.focus{ box-shadow:0 0 0 2px var(--accent); }
  .step-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .step-head .sx{
    font:700 10.5px/1 var(--mono); color:var(--faint);
    background:var(--inset); border-radius:5px; padding:4px 6px; flex:none;
  }
  .step-head .ph-chip{
    color:#fff; padding:2px 7px; border-radius:5px; flex:none;
    font:700 11px/1.5 var(--mono);
  }
  .step-head .dn{ font-weight:640; font-size:13.5px; }
  .step-head .dm{ font:12px/1 var(--mono); color:var(--muted); margin-left:auto; }
  .sec{ margin-top:11px; }
  .sec h4{
    margin:0 0 7px; font-size:10.5px; font-weight:700; letter-spacing:.07em;
    text-transform:uppercase; color:var(--faint);
  }
  .logs{ margin:0; padding-left:20px; }
  .logs li{ font-family:var(--mono); font-size:12px; color:var(--ink); margin:2px 0; }
  .att{ margin:6px 0; }
  .att .an{ font-size:12px; font-weight:600; color:var(--ink); margin:0 0 3px; }
  .eff{ display:flex; flex-direction:column; gap:5px; }
  .eff .e{ display:flex; align-items:center; gap:9px; font-size:12.5px; flex-wrap:wrap; }
  .eff .vd{ width:9px; height:9px; border-radius:50%; flex:none; }
  .eff .vb{ font-weight:600; width:50px; text-transform:capitalize; }
  .eff .id{ font-family:var(--mono); }
  .eff .of{ font-family:var(--mono); color:var(--faint); }
  .eff .da{ color:var(--muted); font-size:12px; }
  .exc{
    margin:0; padding:11px 13px; border-radius:9px; overflow:auto;
    background:var(--fail-bg); border:1px solid color-mix(in srgb, var(--fail) 30%, transparent);
    color:var(--ink); font-family:var(--mono); font-size:12px; line-height:1.55; white-space:pre;
  }
  .skipnote{
    display:flex; align-items:center; gap:9px; padding:10px 13px; border-radius:9px;
    background:var(--skip-bg); border:1px solid color-mix(in srgb, var(--skip) 30%, transparent);
    color:var(--skip-text); font-size:12.5px;
  }
  .skipnote::before{ content:"\26A0"; font-size:14px; }
  .hint{ color:var(--faint); font-size:11.5px; margin:2px 0 10px; }
  .logs li .lg-tag{ color:var(--faint); }
  .res-chip{
    display:inline; font:inherit; font-family:var(--mono); font-weight:600; border:0; padding:0; margin:0; background:transparent;
    color:var(--faint); cursor:pointer; border-radius:3px;
  }
  /* slot colour softened toward the ink; --res-mute is the one knob */
  .res-chip{ --res-mute:62%; }
  .res-chip .rt, .res-chip .rk{ color:color-mix(in oklab, var(--c) var(--res-mute), var(--ink)); }
  .res-chip:hover, .res-chip:focus-visible{ text-decoration:underline; text-decoration-color:var(--rc); outline:none; }
  .res-chip.hl{ background:color-mix(in srgb, var(--rc) 18%, transparent); box-shadow:0 0 0 2px color-mix(in srgb, var(--rc) 18%, transparent); }
  .step-entry.res-hit{ box-shadow:0 0 0 2px var(--rc-hit, var(--accent)); }

  /* ---------- ACTIVITY DIAGRAM (pure SVG; built per scenario) ---------- */
  .actdiag{ display:block; width:100%; height:auto; font-family:var(--ad-font); }
  .ad-nm{ font-weight:400; font-size:7.5px; fill:var(--ad-card-ink); }        /* node label */
  .ad-oth{ font-weight:600; font-size:5.5px; letter-spacing:.05em; fill:var(--ad-panel); } /* card type header text (on colored band) */
  .ad-okn{ font-weight:400; font-size:7.5px; fill:var(--ad-card-ink); }       /* card identifier */
  .ad-vb{ font-style:italic; font-weight:500; font-size:5.5px; paint-order:stroke; stroke:var(--ad-panel); stroke-width:2.4; stroke-linejoin:round; pointer-events:none; } /* verb label + halo */
  .ad-gv{ font-style:italic; font-weight:500; font-size:5.5px; fill:var(--ad-grey-badge); paint-order:stroke; stroke:var(--ad-panel); stroke-width:2.4; stroke-linejoin:round; pointer-events:none; } /* grey verb×count (collapse Tier 3) */
  .ad-vb-leaders{ pointer-events:none; }                                      /* dashed label leaders never absorb hover */
  .ad-bdg{ font-weight:700; font-size:6.5px; }                                /* collapse count badge */
  .ad-phl{ font-weight:500; font-size:7px; letter-spacing:.16em; }            /* rotated phase label */
  .ad-tk{ font:500 6.5px var(--mono); fill:var(--ad-control); }     /* ruler ticks */
  /* object-path hover emphasis: when any object is hovered, dim others; cursor on clickable nodes */
  .ad-flow.has-em [data-obj]:not(.em){ opacity:.22 !important; }
  .ad-flow.has-em [data-obj].em{ opacity:1 !important; }
  .actdiag [data-step]{ cursor:pointer; }
  /* per-fork toggle: zero chrome at rest; revealed on hover or keyboard focus-within */
  .ad-fork .ad-fork-hl, .ad-fork .ad-fork-pill{ opacity:0; transition:opacity .12s; pointer-events:none; }
  .ad-fork:hover .ad-fork-hl, .ad-fork:focus-within .ad-fork-hl,
  .ad-fork:hover .ad-fork-pill, .ad-fork:focus-within .ad-fork-pill{ opacity:1; }
  .ad-fork:hover .ad-fork-pill, .ad-fork:focus-within .ad-fork-pill{ pointer-events:auto; }
  .ad-fork-seg{ cursor:pointer; }
  .ad-fork-seg{ outline:none; }
  .ad-fork-seg .brk{ opacity:0; transition:opacity .14s ease; pointer-events:none; }
  .ad-fork-seg:focus-visible .brk{ opacity:1; }
  @media (prefers-reduced-motion: reduce){ .ad-fork-seg .brk{ transition:none; } }
  /* sun-driven lighting (Phase 2). Per-instance gradient stops keyed by CLASS so one rule serves all N svgs. */
  .ad-sheen .ss0{ stop-color:var(--sheen); stop-opacity:calc(var(--sheen-peak) * var(--sun)); }
  .ad-sheen .ss1{ stop-color:var(--sheen); stop-opacity:calc(var(--sheen-peak) * var(--sun) * 0.3); }
  .ad-sheen .ss2{ stop-color:var(--sheen); stop-opacity:0; }
  .ad-edge  .es0{ stop-color:var(--edge);  stop-opacity:0; }
  .ad-edge  .es2{ stop-color:var(--edge);  stop-opacity:calc(var(--edge-peak) * var(--sun)); }
  /* hover sheen + rim glint: hidden at rest, gentle fade (quicker in, slower out). Positioned by the rAF (Task 3). */
  .ad-lit .ad-sh, .ad-lit .ad-gl{ opacity:0; transition:opacity .5s ease; pointer-events:none; }
  .ad-lit:hover .ad-sh, .ad-lit:hover .ad-gl{ opacity:1; transition:opacity .22s ease; }
  .ad-lit{ cursor:pointer; }
  .ad-lit:focus{ outline:none; }
  /* corner-bracket keyboard focus (distinct from hover); revealed only on :focus-visible (Task 4 extends parity). */
  .ad-lit .brk{ opacity:0; transition:opacity .14s ease; pointer-events:none; }
  .ad-lit:focus-visible .brk{ opacity:1; }
  @media (prefers-reduced-motion: reduce){
    .ad-lit .ad-sh, .ad-lit .ad-gl{ display:none; }       /* no cursor-driven effects without motion */
    .ad-lit .ad-sh, .ad-lit .ad-gl, .ad-lit .brk{ transition:none; }
  }
  @media (prefers-reduced-motion: reduce){ .ad-fork .ad-fork-hl, .ad-fork .ad-fork-pill{ transition:none; } }
</style>
</head>
<body>
  <div class="appbar">
    <div class="brand">
      <div class="logo" title="Raidō">
        <svg viewBox="0 0 20 24" width="14" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 2v20M5 2l10 5.5L5 13l10 9"/>
        </svg>
      </div>
      <div>
        <h1>Raun run report</h1>
        <div class="sub" id="genline"></div>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="phase-legend" aria-label="Given / When / Then phase colors">
      <span class="pl-title">Phases</span>
      <span class="it"><b class="g">G</b>Given</span>
      <span class="it"><b class="w">W</b>When</span>
      <span class="it"><b class="t">T</b>Then</span>
    </div>
  </div>
  <main id="report"></main>

  <script id="model" type="application/json">/*__RAUN_REPORT_JSON__*/</script>

  <script>
    "use strict";
    // explicit theme override for deterministic screenshots
    (function(){
      const p = new URLSearchParams(location.search).get("theme");
      if (p === "dark" || p === "light") document.documentElement.dataset.theme = p;
    })();

    const model = JSON.parse(document.getElementById("model").textContent);

    const esc = (x) => { const d = document.createElement("div"); d.textContent = x == null ? "" : String(x); return d.innerHTML; };
    const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };

    function fmtDur(ms){
      if (ms >= 1000) return (ms / 1000).toFixed(2) + " s";
      return Math.round(ms) + " ms";
    }
    function fmtGen(iso){
      // 2026-06-19T21:42:11Z -> 2026-06-19 21:42:11 UTC
      return iso.replace("T", " ").replace("Z", " UTC").replace(/(\.\d+)/, "");
    }

    // ---- nice auto-scaled axis -------------------------------------------
    function niceAxis(maxMs){
      maxMs = Math.max(maxMs, 1);
      const raw = maxMs / 6;
      const mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const n = raw / mag;
      const step = (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
      const axisMax = Math.ceil(maxMs / step) * step;
      return { step, axisMax };
    }
    function fmtTick(ms, axisMax){
      if (ms === 0) return "0";
      if (axisMax >= 1000){ const s = ms / 1000; return (s % 1 === 0 ? s.toFixed(0) : s.toFixed(1)) + "s"; }
      return ms + "";
    }

    // ---- summary chips ----------------------------------------------------
    const sum = model.summary;
    document.getElementById("genline").textContent =
      model.scenarios.length + " scenarios · generated " + fmtGen(model.generatedAtUtc);
    const chips = document.getElementById("chips");
    const chipDefs = [
      ["pass", sum.passed, "passed"],
      ["fail", sum.failed, "failed"],
      ["skip", sum.skipped, "skipped"],
    ];
    for (const [c, n, l] of chipDefs){
      const e = el("div", "chip " + c);
      e.innerHTML = '<span class="dot"></span><div><div class="n">' + n + '</div><div class="l">' + l + "</div></div>";
      chips.appendChild(e);
    }
    const tw = el("div", "chip meta");
    tw.innerHTML = '<div><div class="n mono">' + fmtDur(sum.totalMs) + '</div><div class="l">wall clock</div></div>';
    chips.appendChild(tw);
    const tg = el("div", "chip meta");
    tg.innerHTML = '<div><div class="n">' + esc(fmtGen(model.generatedAtUtc)) + '</div><div class="l">generated</div></div>';
    chips.appendChild(tg);

    // ---- resource colours: the eight categorical slots (--cat-1..8, stepped per theme in CSS) ----
    // Types take slots in first-seen order; a ninth type wraps. A key hashes into the slots, skipping
    // its type's slot so type and key never share a colour. (The dormant diagram's shade()/contrastInk()
    // expect hex, so re-enable it with hex slots rather than these var() references.)
    const CAT_SLOTS = 8;
    const KEY_SLOTS = 7; // keys hash into slots 1..7 only
    const catVar = (i) => "var(--cat-" + ((i % CAT_SLOTS) + 1) + ")";
    const typeSlotMap = new Map();
    for (const sc of model.scenarios)
      for (const r of sc.resources)
        if (!typeSlotMap.has(r.type)) typeSlotMap.set(r.type, typeSlotMap.size);
    const hashOf = (k) => { let h = 0; for (let i = 0; i < (k || "").length; i++) h = (h * 31 + k.charCodeAt(i)) >>> 0; return h; };
    function typeSlot(t){
      if (!typeSlotMap.has(t)) typeSlotMap.set(t, typeSlotMap.size);
      return typeSlotMap.get(t) % CAT_SLOTS;
    }
    function typeColor(t){ return catVar(typeSlot(t)); }
    function shade(color, amt){ // amt in [-1,1]; >0 -> toward white, <0 -> toward black
      let r,g,b;
      const h = color.match(/^#([0-9a-f]{6})$/i);
      if (h){ const n=parseInt(h[1],16); r=n>>16; g=(n>>8)&255; b=n&255; }
      else { const m=color.match(/hsl\(\s*([\d.]+)[, ]+([\d.]+)%[, ]+([\d.]+)%/i);
        if(!m) return color; const [H,S,L]=[+m[1],+m[2]/100,+m[3]/100];
        const c=(1-Math.abs(2*L-1))*S, x=c*(1-Math.abs((H/60)%2-1)), mm=L-c/2;
        const t=H<60?[c,x,0]:H<120?[x,c,0]:H<180?[0,c,x]:H<240?[0,x,c]:H<300?[x,0,c]:[c,0,x];
        [r,g,b]=t.map(v=>Math.round((v+mm)*255)); }
      const tgt = amt>0?255:0, k=Math.abs(amt);
      const mix=v=>Math.round(v+(tgt-v)*k);
      return "#"+[mix(r),mix(g),mix(b)].map(v=>v.toString(16).padStart(2,"0")).join("");
    }
    function contrastInk(color){
      // Returns dark or light ink chosen by the background's relative luminance,
      // so type-header text is legible regardless of theme.
      let r,g,b;
      const h = color.match(/^#([0-9a-f]{6})$/i);
      if (h){ const n=parseInt(h[1],16); r=n>>16; g=(n>>8)&255; b=n&255; }
      else { const m=color.match(/hsl\(\s*([\d.]+)[, ]+([\d.]+)%[, ]+([\d.]+)%/i);
        if(!m) return "#ffffff"; const [H,S,L]=[+m[1],+m[2]/100,+m[3]/100];
        const c=(1-Math.abs(2*L-1))*S, x=c*(1-Math.abs((H/60)%2-1)), mm=L-c/2;
        const t=H<60?[c,x,0]:H<120?[x,c,0]:H<180?[0,c,x]:H<240?[0,x,c]:H<300?[x,0,c]:[c,0,x];
        [r,g,b]=t.map(v=>Math.round((v+mm)*255)); }
      const lum = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
      return lum > 0.55 ? "#0d1117" : "#ffffff";
    }
    function currentTheme(){
      return document.documentElement.dataset.theme
        || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    }
    function labelColor(objColor){ return shade(objColor, currentTheme()==="dark" ? 0.22 : -0.22); }
    // resource a step produces: its own `create` effect's type, else a resource whose create-event
    // carries this stepId. null if the step creates nothing. (Drives the fork lane's disc-port colour.)
    function producedResourceType(step, sc){
      const ce = (step.effects || []).find((e) => (e.verb || "").toLowerCase() === "create");
      if (ce) return ce.type;
      for (const r of sc.resources || [])
        if ((r.events || []).some((ev) => ev.stepId === step.stepId && (ev.verb || "").toLowerCase() === "create"))
          return r.type;
      return null;
    }

    // ---- scenarios --------------------------------------------------------
    const VCOLOR = { create: "var(--v-create)", read: "var(--v-read)", load: "var(--v-read)", edit: "var(--v-edit)", delete: "var(--v-delete)" };
    const PHCOLOR = { given: "var(--ph-given)", when: "var(--ph-when)", then: "var(--ph-then)" };
    // The activity diagram is kept in code but not rendered for now; the drill opens by default instead.
    const SHOW_DIAGRAM = false;
    // '[resource] {Verb} {Type}:{key}' log lines, optionally timer-stamped ('+0.320s ')
    const RESOURCE_LINE = /^(\+[\d.]+s )?\[resource\] (\w+) ([^:\s]+):(.*)$/;
    // phase-ink (darker, decodable on a white chip riding a saturated lane bar)
    const PHINK = { given: "var(--ph-given-ink)", when: "var(--ph-when-ink)", then: "var(--ph-then-ink)" };
    const report = document.getElementById("report");
    const openers = [];
    // per-scenario object-flow collapse state: scenarioId -> Map(bundleKey -> expansionLevel).
    // A collapsed node click bumps its level; effective tier = max(1, naturalTier - level) (Tier3->2->1).
    const adExpansion = new Map();
    function expansionFor(scenarioId){
      let m = adExpansion.get(scenarioId);
      if (!m){ m = new Map(); adExpansion.set(scenarioId, m); }
      return m;
    }
    // per-scenario fork view choice: scenarioId -> Map(forkKey -> 'graph'|'timeline'). Module-scope so it
    // survives the rerender() replaceChild swap (like adExpansion); session-only, resets on reload.
    const adForkView = new Map();
    function forkViewFor(scenarioId){
      let m = adForkView.get(scenarioId);
      if (!m){ m = new Map(); adForkView.set(scenarioId, m); }
      return m;
    }
    // stable fork identity = its member stepIds, sorted (matches the bundle key buildObjectFlow uses).
    const forkKeyOf = (steps) => steps.map((s) => s.stepId).sort().join("|");

    // SVG namespace for the activity diagram (built with document.createElementNS)
    const SVGNS = "http://www.w3.org/2000/svg";

    // ---- activity-diagram geometry (shared by layoutScenario + buildActivityDiagram) ----
    const AD_W = 680, AD_MARGIN = 20, AD_BAND_W = AD_W - 2 * AD_MARGIN;
    const AD_BAND_TOP = 40, AD_BAND_VPAD = 16, AD_GAP = 22, AD_MIN_BH = 64;
    const NODE_FS = 7.5, NODE_H = 36, NODE_MINW = 64, NODE_PADX = 14;
    const AD_FORK_HEAD = 22, AD_FORK_ROW = 16, AD_FORK_PAD = 12, AD_FORK_W = 300;
    const AD_GRAPH_HEAD = 20, AD_GRAPH_BRANCH_GAP = 16, AD_GRAPH_SIDE_INSET = 12,
          AD_GRAPH_JOIN_GAP = 14, AD_GRAPH_JOIN_H = 10, AD_GRAPH_BAR_H = 5;
    // object-flow geometry (entity cards + ports). CARD_H is reserved by layoutScenario as
    // vertical room below each producing item and re-used verbatim by buildObjectFlow.
    const CARD_HEADER_H = 9, CARD_BODY_H = 16, CARD_H = CARD_HEADER_H + CARD_BODY_H;
    const CARD_PADX = 7, CARD_MINW = 38, CARD_HGAP = 9;
    const CARD_GAP_TOP = 13, CARD_GAP_BOT = 14;          // straight-down room above / S-curve room below a card
    const CARD_TYPE_FS = 5.5, CARD_KEY_FS = 7.5;
    const PORT_INSET = 13, PORT_PITCH = 11, RING_R = 3, DISC_R = 2.6, HALO_R = 4; // clamp/stack node ports
    // verb-label geometry (placement ladder): font size, halo-aware box half-padding, leader threshold
    const VB_FS = 5.5, VB_PAD_X = 1.2, VB_HALF_H = 3.2, VB_LEADER_MIN = 13;
    const phaseColor = (p) => PHCOLOR[p] || "var(--faint)";
    // ---- sun-driven lighting (Phase 2, spec §3/§7) ------------------------
    // One light = the sun for the LOCAL time of day. sunDir is the unit direction tiles are lit FROM
    // (scene-centre -> away from the sun). applySun() refreshes it + the --sun intensity on a slow clock
    // and re-aims every per-tile gradient. The cursor fast-path (sheen/glint) lives in Task 3.
    const AD_SUN_R = 2400;                       // anchor distance >> diagram, so the angle is ~constant across tiles
    const AD_SCENE = { x: AD_W / 2, y: 200 };    // nominal scene centre used as the sun-anchor reference
    const reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    let sunDir = { dx: 0.6, dy: -0.8 };          // pleasant upper-left default until applySun() runs

    // a per-instance directional gradient: userSpaceOnUse, FIXED length L=max(w,h), centred on (cx,cy),
    // endpoints aimed along the current sunDir. Carries data-cx/cy/l so applySun() can re-aim it with NO
    // stored reference. stops = [{o, c, op?}]. Returns [id, <linearGradient>] — the caller appends the element.
    let _adg = 0;
    function dirGrad(stops, cx, cy, L){
      const id = "adg" + (_adg++), h = L / 2;
      const grad = svgEl("linearGradient", {
        id, class: "ad-dir", gradientUnits: "userSpaceOnUse",
        "data-cx": cx.toFixed(2), "data-cy": cy.toFixed(2), "data-l": L.toFixed(2),
        x1: (cx - sunDir.dx * h).toFixed(2), y1: (cy - sunDir.dy * h).toFixed(2),
        x2: (cx + sunDir.dx * h).toFixed(2), y2: (cy + sunDir.dy * h).toFixed(2),
      });
      for (const s of stops){
        const st = svgEl("stop", { offset: s.o });
        st.style.stopColor = s.c;
        if (s.op != null) st.style.stopOpacity = s.op;
        grad.appendChild(st);
      }
      return [id, grad];
    }

    // four thin accent corner ticks hugging a tile (a reticle) — the keyboard-focus affordance (spec §7.5).
    function brackets(x, y, w, h){
      const L = 5.4, o = 1.7, sw = 0.85, g = svgEl("g", { class: "brk" });
      const seg = (d) => {
        const p = svgEl("path", { d, fill: "none", "stroke-width": sw, "stroke-linecap": "butt", "stroke-linejoin": "miter" });
        p.style.stroke = "var(--ring)"; g.appendChild(p);
      };
      seg("M" + (x - o) + "," + (y + L) + " V" + (y - o + 1) + " Q" + (x - o) + "," + (y - o) + " " + (x - o + 1) + "," + (y - o) + " H" + (x + L));
      seg("M" + (x + w - L) + "," + (y - o) + " H" + (x + w + o - 1) + " Q" + (x + w + o) + "," + (y - o) + " " + (x + w + o) + "," + (y - o + 1) + " V" + (y + L));
      seg("M" + (x + w + o) + "," + (y + h - L) + " V" + (y + h + o - 1) + " Q" + (x + w + o) + "," + (y + h + o) + " " + (x + w + o - 1) + "," + (y + h + o) + " H" + (x + w - L));
      seg("M" + (x + L) + "," + (y + h + o) + " H" + (x - o + 1) + " Q" + (x - o) + "," + (y + h + o) + " " + (x - o) + "," + (y + h + o - 1) + " V" + (y + h - L));
      return g;
    }

    // Wrap a tile in the full sun-lit treatment: directional fill + border + gloss gradients (aimed by sunDir),
    // a hover sheen + far-edge rim-glint overlay (per-svg #sheen-<sid>/#edge-<sid>, revealed on :hover by CSS,
    // positioned by the Task-3 rAF), and a corner-bracket :focus-visible reticle. The caller draws label/header
    // on top via o.body(g). o = {x,y,w,h,rx,sid,sw?,fill,border,gloss?,label,body?}.
    function litTile(o){
      const g = svgEl("g", { class: "ad-lit", tabindex: "0", role: "button" });
      if (o.label) g.setAttribute("aria-label", o.label);
      const cx = o.x + o.w / 2, cy = o.y + o.h / 2, L = Math.max(o.w, o.h), sw = o.sw || "0.9", rx = o.rx;
      const [fi, fg] = dirGrad(o.fill, cx, cy, L);
      const [bi, bg] = dirGrad(o.border, cx, cy, L);
      g.appendChild(fg); g.appendChild(bg);
      g.appendChild(svgEl("rect", { x: o.x, y: o.y, width: o.w, height: o.h, rx, fill: "url(#" + fi + ")", stroke: "url(#" + bi + ")", "stroke-width": sw }));
      if (o.gloss !== false){
        const [gi, gg] = dirGrad([{ o: 0, c: "#fff", op: 0.12 }, { o: 0.6, c: "#fff", op: 0 }], cx, cy, L);
        g.appendChild(gg);
        g.appendChild(svgEl("rect", { x: o.x, y: o.y, width: o.w, height: o.h, rx, fill: "url(#" + gi + ")" }));
      }
      if (o.body) o.body(g);
      g.appendChild(svgEl("rect", { class: "ad-sh", x: o.x, y: o.y, width: o.w, height: o.h, rx, fill: "url(#sheen-" + o.sid + ")" }));
      g.appendChild(svgEl("rect", { class: "ad-gl", x: o.x, y: o.y, width: o.w, height: o.h, rx, fill: "none", stroke: "url(#edge-" + o.sid + ")", "stroke-width": sw }));
      g.appendChild(brackets(o.x, o.y, o.w, o.h));
      return g;
    }

    // a structural bar/wall: slate directional fill only (no sheen/glint/focus). Returns a <rect>; the caller
    // must also append the returned gradient (use litBar(parent, …) to append both).
    function litBar(parent, x, y, w, h, rx){
      const [id, grad] = dirGrad(
        [{ o: 0, c: "color-mix(in srgb, var(--ad-wall) 70%, #fff)" }, { o: 1, c: "var(--ad-wall)" }],
        x + w / 2, y + h / 2, Math.max(w, h));
      parent.appendChild(grad);
      const r = svgEl("rect", { x, y, width: w, height: h, fill: "url(#" + id + ")" });
      if (rx != null) r.setAttribute("rx", rx);
      parent.appendChild(r);
      return r;
    }

    // recompute the sun from the LOCAL clock (self-contained) and re-aim every live tile gradient.
    function applySun(){
      let beta;
      if (reduceMotion){ beta = -0.6; }                    // fixed pleasant upper-left angle, no clock
      else { const now = new Date(), h = now.getHours() + now.getMinutes() / 60; beta = (h - 12) * Math.PI / 12; }
      const ax = AD_SCENE.x + Math.sin(beta) * AD_SUN_R, ay = AD_SCENE.y - Math.cos(beta) * AD_SUN_R;
      let dx = AD_SCENE.x - ax, dy = AD_SCENE.y - ay, len = Math.hypot(dx, dy) || 1;
      sunDir = { dx: dx / len, dy: dy / len };
      const elev = Math.cos(beta), inten = 0.65 + (elev >= 0 ? 0.5 : 0.12) * elev;   // noon ~1.15, dusk ~0.65, midnight ~0.53
      document.documentElement.style.setProperty("--sun", inten.toFixed(3));
      for (const grad of document.querySelectorAll("linearGradient.ad-dir")){
        const gx = +grad.getAttribute("data-cx"), gy = +grad.getAttribute("data-cy"), hh = +grad.getAttribute("data-l") / 2;
        grad.setAttribute("x1", (gx - sunDir.dx * hh).toFixed(2)); grad.setAttribute("y1", (gy - sunDir.dy * hh).toFixed(2));
        grad.setAttribute("x2", (gx + sunDir.dx * hh).toFixed(2)); grad.setAttribute("y2", (gy + sunDir.dy * hh).toFixed(2));
      }
    }

    // ---- collapse tiers (spec §4): decide per producer-bundle. Thresholds are tunable defaults.
    const TIER_INDIVIDUAL_MAX = 4;   // <= this many objects total -> Tier 1 (individual cards)
    const TIER_TYPEGROUPS_MAX = 4;   // >  this many type-groups   -> Tier 3 (grey bundle)
    const TIER_TOTAL_MAX = 12;       // >  this many total objects -> Tier 3 (grey bundle)
    function groupBy(arr, keyOf){
      const m = new Map();
      for (const x of arr){ const k = keyOf(x); const a = m.get(k); if (a) a.push(x); else m.set(k, [x]); }
      return m;
    }
    // objs = one per resource in the bundle, each {type, verb}. byType groups by type; a type-group
    // with >1 distinct verb is "mixed" -> Tier 3. ≤4 -> Tier 1; else Tier 2 unless mixed / explodes.
    function tierBundle(objs){
      const byType = groupBy(objs, (o) => o.type);
      const mixed = [...byType.values()].some((g) => new Set(g.map((o) => o.verb)).size > 1);
      if (objs.length <= TIER_INDIVIDUAL_MAX) return { tier: 1, byType };
      if (mixed || byType.size > TIER_TYPEGROUPS_MAX || objs.length > TIER_TOTAL_MAX) return { tier: 3, byType };
      return { tier: 2, byType };
    }

    // ---- text measurement for content-sized nodes ------------------------
    // Source Serif 4's metrics differ from the fallback, so node widths are measured
    // against the live (embedded) font once it loads (see renderAll's document.fonts.ready).
    const AD_FONT = (getComputedStyle(document.documentElement).getPropertyValue("--ad-font") || "").trim()
      || "'Source Serif 4', Georgia, serif";
    let _measureSvg = null;
    function measureSvg(){
      if (!_measureSvg){
        _measureSvg = svgEl("svg", { width: 0, height: 0, "aria-hidden": "true" });
        _measureSvg.style.position = "absolute";
        _measureSvg.style.left = "-9999px";
        _measureSvg.style.visibility = "hidden";
        document.body.appendChild(_measureSvg);
      }
      return _measureSvg;
    }
    function measureText(str, px, weight, italic){
      const t = svgEl("text", { "font-size": px, "font-weight": weight || 400, visibility: "hidden" });
      t.setAttribute("font-family", AD_FONT);
      if (italic) t.setAttribute("font-style", "italic");
      t.textContent = str == null ? "" : String(str);
      measureSvg().appendChild(t);
      const w = t.getComputedTextLength();
      t.remove();
      return w;
    }
    // content-sized box: measured label + horizontal padding, clamped to a min-width floor.
    function nodeBox(label){
      const w = Math.max(NODE_MINW, Math.round(measureText(label, NODE_FS, 400) + 2 * NODE_PADX));
      return { w, h: NODE_H };
    }
    // node label = displayName with its redundant leading phase word ("Given "/"When "/"Then ") dropped.
    function nodeLabel(step){
      const ph = (step.phase || "").trim();
      let n = step.displayName || "";
      if (ph && n.toLowerCase().startsWith(ph.toLowerCase() + " ")) n = n.slice(ph.length + 1);
      return n || step.displayName || step.label || "";
    }

    // ---- layout classification (THE interface the fork cell consumes) ----
    // Walks a scenario's steps in index order and classifies them into an ordered list of
    // spine items:  { kind:'node'|'fork', steps:[…], phase, x, y, w, h }  (y = absolute top).
    //   • 'node' — an ordinary sequential step, rendered as a content-sized action/assert box.
    //   • 'fork' — a MAXIMAL run of parallel steps (same phase, sharing a groupId or
    //              overlapping in time on different lanes). It reserves ONE vertical slot
    //              ({x,y,w,h}, centred on the spine) that buildForkCell fills with the cell.
    // Also derives the phase swimlane bands, sized to contain the items they hold.
    // Returns { items, bands, contentBottom }.
    function layoutScenario(sc){
      const cx = AD_W / 2;
      const steps = sc.steps.slice().sort((a, b) => a.index - b.index);

      const overlap = (a, b) =>
        a.offsetMs < b.offsetMs + b.durationMs && b.offsetMs < a.offsetMs + a.durationMs;
      const coParallel = (a, b) =>
        (a.phase || "").toLowerCase() === (b.phase || "").toLowerCase() &&
        ((a.groupId != null && a.groupId === b.groupId) || (a.lane !== b.lane && overlap(a, b)));

      // maximal runs of index-contiguous, MUTUALLY co-parallel steps. A step joins the open run
      // only if it is co-parallel with EVERY current member (all-pairs concurrency) — not merely
      // with one, which could over-merge a transitive chain (A∥B, B∥C, but ¬A∥C).
      const groups = [];
      for (const s of steps){
        const run = groups.length ? groups[groups.length - 1] : null;
        if (run && run.every((m) => coParallel(m, s))) run.push(s);
        else groups.push([s]);
      }

      // size each item (fork = reserved slot; node = content-sized box)
      const items = groups.map((g) => {
        const phase = (g[0].phase || "").toLowerCase();
        if (g.length >= 2){
          const view = forkViewFor(sc.scenarioId).get(forkKeyOf(g)) || "graph";   // graph is the default
          if (view === "timeline"){
            const w = Math.min(AD_BAND_W - 24, Math.max(160, AD_FORK_W));
            const h = AD_FORK_HEAD + g.length * AD_FORK_ROW + AD_FORK_PAD;
            return { kind: "fork", view, steps: g, phase, w, h, x: cx - w / 2, y: 0 };
          }
          // graph view: fork bar + a row of content-sized branch nodes + join bar
          const lanes = g.slice().sort((a, b) => a.lane - b.lane);
          const branchW = lanes.map((s) => nodeBox(nodeLabel(s)).w);
          const contentW = branchW.reduce((a, b) => a + b, 0) + (lanes.length - 1) * AD_GRAPH_BRANCH_GAP;
          const w = Math.min(AD_BAND_W - 24, Math.max(160, contentW + 2 * AD_GRAPH_SIDE_INSET));
          const h = AD_GRAPH_HEAD + NODE_H + AD_GRAPH_JOIN_GAP + AD_GRAPH_JOIN_H;
          return { kind: "fork", view, steps: g, phase, w, h, x: cx - w / 2, y: 0 };
        }
        const b = nodeBox(nodeLabel(g[0]));
        return { kind: "node", steps: g, phase, w: b.w, h: b.h, x: cx - b.w / 2, y: 0 };
      });

      // ---- object-flow plan (drives card placement + the vertical room cards need) -------
      // For each resource that is created somewhere, resolve the producing layout item and the
      // consuming items, then mark each producing item so the placement loop reserves a card row
      // (CARD_H + gaps) directly below it. buildObjectFlow re-uses `flows` verbatim for geometry.
      const stepItem = new Map();
      for (const it of items) for (const s of it.steps) stepItem.set(s.stepId, it);
      const flows = [];
      for (const r of (sc.resources || [])){
        const ce = (r.events || []).find((e) => (e.verb || "").toLowerCase() === "create");
        if (!ce) continue;
        const prodItem = stepItem.get(ce.stepId);
        if (!prodItem) continue;
        const consumers = (r.events || [])
          .filter((e) => (e.verb || "").toLowerCase() !== "create")
          .map((e) => ({ stepId: e.stepId, verb: e.verb, item: stepItem.get(e.stepId) }))
          .filter((c) => c.item);
        flows.push({ type: r.type, key: r.key, createVerb: ce.verb, producerStepId: ce.stepId, prodItem, consumers });
      }
      const producesCards = new Set(flows.map((f) => f.prodItem));

      // place items top-to-bottom, opening a swimlane band per contiguous phase run
      const bands = [];
      let y = AD_BAND_TOP, cur = null;
      const closeBand = () => { if (cur){ y += AD_BAND_VPAD; cur.h = y - cur.y; } };
      for (const it of items){
        if (!cur || cur.key !== it.phase){
          closeBand();
          cur = { key: it.phase, label: it.phase.toUpperCase(), color: phaseColor(it.phase), y, h: 0, items: [] };
          bands.push(cur);
          y += AD_BAND_VPAD;             // band top padding
        } else {
          y += AD_GAP;                   // control edge between two items in the same band
        }
        it.y = y;
        cur.items.push(it);
        y += it.h;
        // reserve a card row below any item that produces object(s): one row regardless of count
        // (fork lanes share one row; a node's cards stack in one row beneath it).
        if (producesCards.has(it)){ it.gapAfter = CARD_GAP_TOP + CARD_H + CARD_GAP_BOT; y += it.gapAfter; }
      }
      closeBand();

      const contentBottom = items.length ? y : AD_BAND_TOP + AD_MIN_BH;
      return { items, bands, contentBottom, flows };
    }

    function renderAll(){
      report.replaceChildren();
      openers.length = 0;
      for (const sc of model.scenarios) report.appendChild(renderScenario(sc));

      // pre-expand the first failing step's scenario drill so its detail is visible by default
      for (const sc of model.scenarios){
        const failing = sc.steps.find((s) => s.status === "failed");
        if (failing){
          const o = openers.find((x) => x.scenarioId === sc.scenarioId);
          if (o){ o.open(failing.stepId); break; }
        }
      }
    }
    // First paint uses the fallback font so the page is never blank; re-measure + re-render
    // once Source Serif 4 is ready (its metrics, hence node widths, differ from the fallback).
    applySun();                                   // set sunDir + --sun before first paint -> tiles born lit
    renderAll();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderAll);
    if (!reduceMotion) setInterval(applySun, 60000);   // the sun barely moves; re-aim tiles each minute

    // ---- cursor fast-path (spec §3/§7.4): sheen + rim glint follow the pointer, in the HOVERED svg ONLY.
    // Per-tile gradients are sun-only (D2), so this writes at most 2 nodes/frame: the active svg's #sheen-<id>
    // centre (eased toward the cursor) and #edge-<id> span (on the hovered tile's far edge). Guarded: the rAF
    // self-stops when the cursor settles; reduced-motion skips it entirely.
    let actSvg = null, actSheen = null, actEdge = null, tileBB = null;
    let tgX = 0, tgY = 0, cuX = 0, cuY = 0, rafId = 0;
    function lightFrom(svg){
      if (svg === actSvg) return false;
      actSvg = svg;
      actSheen = svg ? svg.querySelector("radialGradient.ad-sheen") : null;
      actEdge = svg ? svg.querySelector("linearGradient.ad-edge") : null;
      return true;
    }
    function tick(){
      rafId = 0;
      if (actSvg && !actSvg.isConnected){ lightFrom(null); tileBB = null; return; }   // dropped by a rerender
      let moving = false;
      if (actSheen){
        if (Math.abs(tgX - cuX) + Math.abs(tgY - cuY) > 0.1){ cuX += (tgX - cuX) * 0.12; cuY += (tgY - cuY) * 0.12; moving = true; }
        else { cuX = tgX; cuY = tgY; }
        actSheen.setAttribute("cx", cuX.toFixed(1)); actSheen.setAttribute("cy", cuY.toFixed(1));
        actSheen.setAttribute("fx", cuX.toFixed(1)); actSheen.setAttribute("fy", cuY.toFixed(1));
      }
      if (actEdge && tileBB){                                  // single glint, bright on the FAR edge (away from the sun)
        const span = 0.5 * Math.hypot(tileBB.width, tileBB.height) + 7;
        const ex = tileBB.x + tileBB.width / 2, ey = tileBB.y + tileBB.height / 2;
        actEdge.setAttribute("x1", (ex - sunDir.dx * span).toFixed(1)); actEdge.setAttribute("y1", (ey - sunDir.dy * span).toFixed(1));
        actEdge.setAttribute("x2", (ex + sunDir.dx * span).toFixed(1)); actEdge.setAttribute("y2", (ey + sunDir.dy * span).toFixed(1));
      }
      if (moving) rafId = requestAnimationFrame(tick);         // keep going only while easing; settles when idle
    }
    function ensureRaf(){ if (!rafId) rafId = requestAnimationFrame(tick); }
    if (!reduceMotion){
      report.addEventListener("pointermove", (e) => {
        const svg = e.target && e.target.closest ? e.target.closest("svg.actdiag") : null;
        const switched = lightFrom(svg);
        if (!svg){ tileBB = null; return; }
        const m = svg.getScreenCTM(); if (!m) return;
        const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
        const loc = pt.matrixTransform(m.inverse());
        tgX = loc.x; tgY = loc.y;
        if (switched){ cuX = tgX; cuY = tgY; }   // snap sheen to the cursor in the new svg's space (no cross-svg flash)
        const tile = e.target.closest(".ad-lit");
        tileBB = tile ? tile.getBBox() : null;                // BBox in THIS svg's user space (incl. the brackets margin — fine)
        ensureRaf();
      });
    }

    // small helper: create a namespaced SVG element with a set of attributes
    function svgEl(tag, attrs){
      const e = document.createElementNS(SVGNS, tag);
      if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }

    // ---- activity diagram: swimlane frame (bands + tabs + rotated labels) carrying the
    //      classified layout (layoutScenario): content-sized action/assert nodes on a centred
    //      spine, joined by control-flow edges, with each fork group rendered as the packaged
    //      inline-timeline cell (buildForkCell). Plus the initial + final nodes. <svg class="actdiag">. ----
    function buildActivityDiagram(sc, rerender){
      const W = AD_W, bandX = AD_MARGIN, bandW = AD_BAND_W, cx = W / 2;
      const TAB_DX = 7, TAB_W = 2.5, LABEL_DX = 24;
      const INITIAL_CY = 22, INITIAL_R = 5.5, FINAL_R = 8, FINAL_CORE_R = 3.4;

      const layout = layoutScenario(sc);
      const bands = layout.bands, items = layout.items;
      const finalCy = layout.contentBottom + 28;
      const H = finalCy + 24;

      const svg = svgEl("svg", {
        class: "actdiag",
        viewBox: "0 0 " + W + " " + H,
        role: "img",
        "aria-label": "Activity diagram: " + sc.displayName,
        preserveAspectRatio: "xMidYMid meet",
      });

      // arrowhead marker for control-flow edges (id unique per scenario svg)
      const arrowId = "ad-arrow-" + sc.scenarioId;
      const defs = svgEl("defs");
      const marker = svgEl("marker", {
        id: arrowId, viewBox: "0 0 8 8", refX: "6.8", refY: "4",
        markerWidth: "4.4", markerHeight: "4.4", orient: "auto",
      });
      const arrow = svgEl("path", { d: "M0,0 L8,4 L0,8 z" });
      arrow.style.fill = "var(--ad-control)";
      marker.appendChild(arrow);
      defs.appendChild(marker);
      // per-scenario cursor-lit gradients (positioned by the Task-3 rAF; userSpaceOnUse = THIS svg's space)
      const sid = sc.scenarioId;
      const sheen = svgEl("radialGradient", { id: "sheen-" + sid, class: "ad-sheen", gradientUnits: "userSpaceOnUse", cx: "-999", cy: "-999", r: "165", fx: "-999", fy: "-999" });
      sheen.appendChild(svgEl("stop", { offset: "0", class: "ss0" }));
      sheen.appendChild(svgEl("stop", { offset: "0.45", class: "ss1" }));
      sheen.appendChild(svgEl("stop", { offset: "1", class: "ss2" }));
      defs.appendChild(sheen);
      const edge = svgEl("linearGradient", { id: "edge-" + sid, class: "ad-edge", gradientUnits: "userSpaceOnUse", x1: "-999", y1: "-999", x2: "-998", y2: "-998" });
      edge.appendChild(svgEl("stop", { offset: "0", class: "es0" }));
      edge.appendChild(svgEl("stop", { offset: "0.5", class: "es0" }));
      edge.appendChild(svgEl("stop", { offset: "0.66", class: "es2" }));
      edge.appendChild(svgEl("stop", { offset: "1", class: "es2" }));
      defs.appendChild(edge);
      svg.appendChild(defs);

      // swimlane bands (tinted phase fill at the theme band opacity)
      for (const b of bands){
        const r = svgEl("rect", { x: bandX, y: b.y, width: bandW, height: b.h });
        r.style.fill = b.color;
        r.style.opacity = "var(--ad-band-op)";
        svg.appendChild(r);
      }
      // dividers between consecutive bands
      for (let i = 1; i < bands.length; i++){
        const ln = svgEl("line", { x1: bandX, y1: bands[i].y, x2: bandX + bandW, y2: bands[i].y });
        ln.style.stroke = "var(--ad-grid)";
        svg.appendChild(ln);
      }
      // phase tabs + rotated labels (coloured per phase)
      for (const b of bands){
        const tab = svgEl("rect", {
          x: bandX + TAB_DX, y: b.y + 12, width: TAB_W, height: Math.max(8, b.h - 24), rx: 1,
        });
        tab.style.fill = b.color;
        svg.appendChild(tab);
        const lx = bandX + LABEL_DX, ly = b.y + b.h / 2;
        const t = svgEl("text", {
          class: "ad-phl", x: lx, y: ly,
          transform: "rotate(-90 " + lx + " " + ly + ")",
          "text-anchor": "middle",
        });
        t.style.fill = b.color;
        t.textContent = b.label;
        svg.appendChild(t);
      }

      // initial node (filled circle, top of the spine)
      const initial = svgEl("circle", { cx: cx, cy: INITIAL_CY, r: INITIAL_R });
      initial.style.fill = "var(--ad-card-ink)";
      svg.appendChild(initial);

      // control-flow edges: initial -> each layout item -> final. Arrowheads point into every
      // target except a fork slot (the fork bar is the join, mirroring the mock spine).
      const edges = svgEl("g", {
        fill: "none", "stroke-width": "1", "stroke-linecap": "round", "stroke-linejoin": "round",
      });
      edges.style.stroke = "var(--ad-control)";
      const addEdge = (y1, y2, head) => {
        if (y2 <= y1) return;
        const p = svgEl("path", { d: "M" + cx + "," + y1 + " V" + y2 });
        if (head) p.setAttribute("marker-end", "url(#" + arrowId + ")");
        edges.appendChild(p);
      };
      let prevBottom = INITIAL_CY + INITIAL_R;
      for (const it of items){
        addEdge(prevBottom, it.y, it.kind !== "fork");
        prevBottom = it.y + it.h;
      }
      addEdge(prevBottom, finalCy - FINAL_R, true);
      svg.appendChild(edges);

      // item bodies: content-sized action/assert boxes; fork groups get the packaged inline-timeline cell
      // (buildForkCell populates each fork it.ports — consumed by buildObjectFlow next).
      for (const it of items){
        if (it.kind !== "fork"){ svg.appendChild(actionNode(it, sid)); continue; }
        const wrap = svgEl("g", { class: "ad-fork" });
        wrap.setAttribute("data-fork-key", forkKeyOf(it.steps));
        wrap.appendChild(it.view === "timeline" ? buildForkCell(it, sc) : buildForkGraph(it, sc));
        wrap.appendChild(buildForkToggle(it));    // hover-revealed highlight + pill (drawn once, both views)
        svg.appendChild(wrap);
      }

      // object flow: entity cards + flow edges + ring/disc ports, drawn on top of the spine/nodes.
      const flow = buildObjectFlow(sc, layout, rerender);
      svg.appendChild(flow.g);
      layout.flow = flow;   // expose {cards, edges} for Task 7 (verb labels) + Task 8 (collapse)

      // final node (ring + filled core, bottom of the spine)
      const ring = svgEl("circle", { cx: cx, cy: finalCy, r: FINAL_R, fill: "none", "stroke-width": "1.4" });
      ring.style.stroke = "var(--ad-card-ink)";
      svg.appendChild(ring);
      const core = svgEl("circle", { cx: cx, cy: finalCy, r: FINAL_CORE_R });
      core.style.fill = "var(--ad-card-ink)";
      svg.appendChild(core);

      return svg;
    }

    // a content-sized action/assert node: sun-lit phase-tinted box (rx 3) + centred .ad-nm label,
    // status-styled (failed -> red border; skipped -> muted grey). sid = scenario id for the per-svg sheen/glint.
    function actionNode(it, sid){
      const st = it.steps[0], status = (st.status || "").toLowerCase(), tint = phaseColor(it.phase);
      const fillC = status === "skipped"
        ? "color-mix(in srgb, var(--ad-grey) 12%, var(--ad-panel))"
        : "color-mix(in srgb, " + tint + " 15%, var(--ad-panel))";
      const hue = status === "skipped" ? "var(--ad-grey)" : status === "failed" ? "var(--fail)" : tint;
      const g = litTile({
        x: it.x, y: it.y, w: it.w, h: it.h, rx: 3, sid,
        sw: status === "failed" ? "1.3" : "1",
        fill: [{ o: 0, c: fillC }, { o: 1, c: fillC, op: 0.95 }],
        border: [{ o: 0, c: hue, op: 0.9 }, { o: 1, c: hue, op: 0.5 }],
        label: nodeLabel(st),
        body: (g) => {
          const label = svgEl("text", { class: "ad-nm", x: it.x + it.w / 2, y: it.y + it.h / 2, "text-anchor": "middle", "dominant-baseline": "central" });
          if (status === "skipped") label.style.fill = "var(--ad-grey)";
          label.textContent = nodeLabel(st);
          g.appendChild(label);
        },
      });
      g.setAttribute("data-step", st.stepId);   // click -> focusStep delegation (existing)
      return g;
    }

    // Hover/focus-revealed per-fork toggle: a faint accent block highlight + a near-square segmented pill
    // reading "show as [ graph | timeline ]" (variant i — muted label, then a bordered track of two segments;
    // active segment highlighted). Reveal/hide is pure CSS (.ad-fork:hover/:focus-within). Clicking/Enter on
    // a segment is handled by the delegated listener in buildScenarioCard.
    function buildForkToggle(it){
      const g = svgEl("g"), cx = AD_W / 2;

      // block highlight: wraps the whole fork slot, behind the pill
      const hl = svgEl("rect", {
        class: "ad-fork-hl", x: it.x - 4, y: it.y - 4, width: it.w + 8, height: it.h + 8, rx: 6,
        fill: "var(--accent)", "fill-opacity": ".06", stroke: "var(--accent)", "stroke-opacity": ".5", "stroke-width": "1.2",
      });
      g.appendChild(hl);

      // segmented pill, centred over the fork bar
      const FS = 8.5, H = 16, SEG_PADX = 9, RX = 4, current = it.view === "timeline" ? "timeline" : "graph";
      const labW = measureText("show as", FS, 400) + 8;
      const segs = ["graph", "timeline"].map((t) => ({ t, w: Math.round(measureText(t, FS, 500) + 2 * SEG_PADX) }));
      const trackW = segs.reduce((a, s) => a + s.w, 0) + 4;          // +inner pad
      const pillW = 4 + labW + trackW + 6;
      const px = Math.round(cx - pillW / 2), py = Math.round(it.y + 4);

      const pill = svgEl("g", { class: "ad-fork-pill" });
      const bg = svgEl("rect", { x: px, y: py, width: pillW, height: H, rx: RX });
      bg.style.fill = "var(--ad-panel)"; bg.style.stroke = "var(--ad-card-border)"; bg.setAttribute("stroke-width", "1");
      bg.style.filter = "drop-shadow(0 2px 6px rgba(0,0,0,.30))";
      pill.appendChild(bg);

      const lab = svgEl("text", { x: px + 4 + labW / 2, y: py + H / 2, "text-anchor": "middle", "dominant-baseline": "central" });
      lab.style.cssText = "font-size:" + FS + "px;fill:var(--muted);";
      lab.textContent = "show as";
      pill.appendChild(lab);

      const trackX = px + 4 + labW, trackY = py + 2.5;
      const track = svgEl("rect", { x: trackX, y: trackY, width: trackW, height: H - 5, rx: RX - 1 });
      track.style.fill = "var(--ad-cell)"; track.style.stroke = "var(--ad-card-border)"; track.setAttribute("stroke-width", "1");
      pill.appendChild(track);

      let sx = trackX + 2;
      for (const s of segs){
        const active = s.t === current;
        const seg = svgEl("g", { class: "ad-fork-seg", role: "button", tabindex: "0" });
        seg.setAttribute("data-fork-set", s.t);
        seg.setAttribute("aria-label", "show this fork as " + s.t);
        const box = svgEl("rect", { x: sx, y: trackY + 1.5, width: s.w, height: H - 8, rx: RX - 2 });
        if (active){
          const [ai, ag] = dirGrad([{ o: 0, c: "color-mix(in srgb, var(--accent) 78%, #fff)" }, { o: 1, c: "var(--accent)" }], sx + s.w / 2, trackY + 1.5 + (H - 8) / 2, Math.max(s.w, H - 8));
          seg.appendChild(ag); box.setAttribute("fill", "url(#" + ai + ")");
        } else { box.style.fill = "transparent"; }
        seg.appendChild(box);
        const tx = svgEl("text", { x: sx + s.w / 2, y: py + H / 2, "text-anchor": "middle", "dominant-baseline": "central" });
        tx.style.cssText = "font-size:" + FS + "px;font-weight:500;fill:" + (active ? "#fff" : "var(--muted)") + ";";
        tx.textContent = s.t;
        seg.appendChild(tx);
        seg.appendChild(brackets(sx, trackY + 1.5, s.w, H - 8));   // corner-bracket focus (replaces the outline)
        pill.appendChild(seg);
        sx += s.w;
      }
      g.appendChild(pill);
      return g;
    }

    // Graph view of a fork: a short spine stub into a solid slate FORK BAR, a row of content-sized
    // phase-tinted BRANCH NODES (one per lane, click->focusStep via data-step), producer DISC PORTS at each
    // branch-node bottom, then an option-A slate JOIN BAR segmented with a gap at each producing disc x, and a
    // spine stub out. Sets it.ports identically to buildForkCell so buildObjectFlow attaches edges view-agnostically.
    function buildForkGraph(it, sc){
      const g = svgEl("g");
      const GAP = 5, cx = AD_W / 2, tint = phaseColor(it.phase);
      const lanes = it.steps.slice().sort((a, b) => a.lane - b.lane);
      const forkBarY = it.y + AD_GRAPH_HEAD - AD_GRAPH_BAR_H;
      const branchTop = it.y + AD_GRAPH_HEAD, branchBot = branchTop + NODE_H;
      const joinY = branchBot + AD_GRAPH_JOIN_GAP;

      // central spine stubs so the control edge visibly meets the bars (the edge from buildActivityDiagram
      // ends at it.y and resumes at it.y+it.h; bridge to the fork/join bars).
      const spine = svgEl("g", { stroke: "var(--ad-control)", "stroke-width": "1", fill: "none" });
      spine.appendChild(svgEl("line", { x1: cx, y1: it.y, x2: cx, y2: forkBarY }));
      spine.appendChild(svgEl("line", { x1: cx, y1: joinY + AD_GRAPH_BAR_H, x2: cx, y2: it.y + it.h }));
      g.appendChild(spine);

      // PARALLEL tag
      const tag = svgEl("text", { class: "ad-tk", x: it.x + 2, y: it.y + 7 });
      tag.style.letterSpacing = ".12em"; tag.textContent = "PARALLEL";
      g.appendChild(tag);

      // fork bar (top, full slot width, slate, sun-lit)
      litBar(g, it.x, forkBarY, it.w, AD_GRAPH_BAR_H, 2.5);

      // branch nodes, content-sized, centred on the spine; collect each lane's producer disc port
      const boxes = lanes.map((s) => Object.assign({ s }, nodeBox(nodeLabel(s))));
      const totalW = boxes.reduce((a, b) => a + b.w, 0) + (boxes.length - 1) * AD_GRAPH_BRANCH_GAP;
      let bx = cx - totalW / 2;
      const ports = [];
      for (const b of boxes){
        const s = b.s, status = (s.status || "").toLowerCase();
        const fillC = status === "skipped"
          ? "color-mix(in srgb, var(--ad-grey) 12%, var(--ad-panel))"
          : "color-mix(in srgb, " + tint + " 15%, var(--ad-panel))";
        const hue = status === "skipped" ? "var(--ad-grey)" : status === "failed" ? "var(--fail)" : tint;
        const bxL = bx;                                   // capture for the body closure
        const node = litTile({
          x: bxL, y: branchTop, w: b.w, h: NODE_H, rx: 3, sid: sc.scenarioId,
          sw: status === "failed" ? "1.3" : "1",
          fill: [{ o: 0, c: fillC }, { o: 1, c: fillC, op: 0.95 }],
          border: [{ o: 0, c: hue, op: 0.9 }, { o: 1, c: hue, op: 0.5 }],
          label: nodeLabel(s),
          body: (g) => {
            const label = svgEl("text", { class: "ad-nm", x: bxL + b.w / 2, y: branchTop + NODE_H / 2, "text-anchor": "middle", "dominant-baseline": "central" });
            if (status === "skipped") label.style.fill = "var(--ad-grey)";
            label.textContent = nodeLabel(s);
            g.appendChild(label);
          },
        });
        node.setAttribute("data-step", s.stepId);
        g.appendChild(node);

        const rtype = producedResourceType(s, sc);
        ports.push({
          x: bx + b.w / 2, y: branchBot,
          color: rtype ? typeColor(rtype) : "var(--ad-control)", resourceType: rtype, stepId: s.stepId,
        });
        bx += b.w + AD_GRAPH_BRANCH_GAP;
      }

      // join bar (option A): slate, segmented with a GAP at each producing disc x (mirrors buildForkCell)
      const gapXs = ports.filter((p) => p.resourceType).map((p) => p.x).sort((a, b) => a - b);
      const join = svgEl("g");
      let segX = it.x;
      for (const gx of gapXs){
        const gs = gx - GAP / 2;
        if (gs > segX) litBar(join, segX, joinY, gs - segX, AD_GRAPH_BAR_H);
        segX = gx + GAP / 2;
      }
      if (it.x + it.w > segX) litBar(join, segX, joinY, it.x + it.w - segX, AD_GRAPH_BAR_H);
      g.appendChild(join);

      // disc ports (filled disc + faint halo) drawn on top
      for (const p of ports){
        if (!p.resourceType) continue;
        const halo = svgEl("circle", { cx: p.x, cy: p.y, r: HALO_R, fill: "none", "stroke-width": "0.8" });
        halo.style.stroke = p.color; halo.style.opacity = ".35"; g.appendChild(halo);
        const disc = svgEl("circle", { cx: p.x, cy: p.y, r: DISC_R }); disc.style.fill = p.color; g.appendChild(disc);
      }

      it.ports = ports;   // the contract buildObjectFlow consumes (same shape as the timeline cell)
      return g;
    }

    // Fork cell — the diagram's centrepiece: a 4-walled "package" wrapping an inline SVG timeline of
    // the parallel lanes (mirrors the v17 mock, themed via the --ad-* vars so it works light + dark).
    // It fills the slot Task 4 reserved (it.x/y/w/h, already centred on the spine): the heavy fork bar
    // (top) meets the incoming control edge, the join bar (bottom) the outgoing one. The time axis is
    // auto-scaled to the lanes' max end (niceAxis), so the cell is cropped to its own content. Records
    // each lane's disc-port geometry on it.ports = [{x,y,color,resourceType,stepId}] for Task 6 to
    // attach object-flow edges, and leaves a clean gap in the join wall at each such port's x.
    function buildForkCell(it, sc){
      const g = svgEl("g");
      const cellX = it.x, cellY = it.y, cellW = it.w, cellH = it.h;
      const cellRight = cellX + cellW, cellBottom = cellY + cellH;
      const WALL = 2.5, HEADER = 13, BOTTOM_PAD = 4, LEFT_INSET = 16, RIGHT_INSET = 12, MIN_BAR = 14, GAP = 5;

      // one lane per fork-member step, ordered by lane
      const lanes = it.steps.slice().sort((a, b) => a.lane - b.lane);
      const n = lanes.length;

      // time axis — absolute scenario offsets, cropped to the lanes' max end via niceAxis (reused)
      const maxEnd = Math.max(1, ...lanes.map((s) => s.offsetMs + s.durationMs));
      const { step, axisMax } = niceAxis(maxEnd);
      const trackLeft = cellX + LEFT_INSET, trackRight = cellRight - RIGHT_INSET;
      const trackW = trackRight - trackLeft, px = trackW / axisMax;

      // vertical bands: fork bar + tick header on top, lanes in the middle, join bar at the bottom
      const lanesTop = cellY + WALL + HEADER, lanesBottom = cellBottom - WALL - BOTTOM_PAD;
      const rowPitch = (lanesBottom - lanesTop) / n;
      const BAR_H = Math.max(7, Math.min(12, rowPitch - 3));

      // cell panel
      const panel = svgEl("rect", { x: cellX, y: cellY, width: cellW, height: cellH, rx: 2 });
      panel.style.fill = "var(--ad-cell)";
      const [pbi, pbg] = dirGrad([{ o: 0, c: "var(--ad-card-border-hi, var(--ad-wall))" }, { o: 1, c: "var(--ad-card-border)" }], cellX + cellW / 2, cellY + cellH / 2, Math.max(cellW, cellH));
      panel.setAttribute("stroke", "url(#" + pbi + ")"); panel.setAttribute("stroke-width", "1");
      g.appendChild(pbg); g.appendChild(panel);

      // inner zebra rows (every other lane)
      for (let i = 0; i < n; i += 2){
        const z = svgEl("rect", {
          x: cellX + WALL, y: lanesTop + i * rowPitch, width: cellW - 2 * WALL, height: rowPitch,
        });
        z.style.fill = "var(--ad-cell-row)";
        g.appendChild(z);
      }

      // vertical gridlines at each tick
      const grid = svgEl("g", { "stroke-width": "1" });
      grid.style.stroke = "var(--ad-grid)";
      for (let t = 0; t <= axisMax + 1e-6; t += step){
        const gx = trackLeft + t * px;
        grid.appendChild(svgEl("line", { x1: gx, y1: lanesTop - 2, x2: gx, y2: cellBottom - WALL }));
      }
      g.appendChild(grid);

      // tag + ms gutter + tick labels (.ad-tk)
      const tickBase = cellY + WALL + 9;
      const tag = svgEl("text", { class: "ad-tk", x: cellX + WALL + 2, y: cellY - 3 });
      tag.style.letterSpacing = ".12em";
      tag.textContent = "PARALLEL";
      g.appendChild(tag);
      const ms = svgEl("text", { class: "ad-tk", x: trackLeft - 7, y: tickBase, "text-anchor": "end" });
      ms.textContent = "ms";
      g.appendChild(ms);
      for (let t = 0; t <= axisMax + 1e-6; t += step){
        const lab = svgEl("text", { class: "ad-tk", x: trackLeft + t * px, y: tickBase, "text-anchor": "middle" });
        lab.textContent = fmtTick(t, axisMax);
        g.appendChild(lab);
      }

      // lane bars (phase-hued) + white G/W/T chip + serif label; collect each lane's disc port
      const tint = phaseColor(it.phase);
      const ink = PHINK[it.phase] || "var(--ad-card-ink)";
      const letter = (it.phase || "?").charAt(0).toUpperCase();
      const ports = [];
      for (let i = 0; i < n; i++){
        const s = lanes[i];
        const barCY = lanesTop + i * rowPitch + rowPitch / 2;
        const barX = trackLeft + s.offsetMs * px;
        const barW = Math.max(MIN_BAR, s.durationMs * px);

        const bar = svgEl("rect", { x: barX, y: barCY - BAR_H / 2, width: barW, height: BAR_H, rx: 1.5 });
        bar.style.fill = tint;
        g.appendChild(bar);

        const chipS = Math.min(9, BAR_H - 1.5);
        const chip = svgEl("rect", { x: barX + 1.2, y: barCY - chipS / 2, width: chipS, height: chipS, rx: 1.5 });
        chip.style.fill = "#eef3fa";
        g.appendChild(chip);
        const gl = svgEl("text", {
          x: barX + 1.2 + chipS / 2, y: barCY, "text-anchor": "middle", "dominant-baseline": "central",
          "font-family": "var(--mono)",
        });
        gl.style.cssText = "font-weight:700;font-size:" + (chipS - 3.5) + "px;fill:" + ink + ";";
        gl.textContent = letter;
        g.appendChild(gl);

        const lbl = svgEl("text", { class: "ad-okn", x: barX + chipS + 4, y: barCY, "dominant-baseline": "central" });
        lbl.style.cssText = "font-size:6.5px;fill:#ffffff;";
        lbl.textContent = nodeLabel(s);
        g.appendChild(lbl);

        // disc port at the production (right) end, coloured by the resource the step creates
        const rtype = producedResourceType(s, sc);
        ports.push({
          x: trackLeft + (s.offsetMs + s.durationMs) * px, y: barCY,
          color: rtype ? typeColor(rtype) : "var(--ad-control)", resourceType: rtype, stepId: s.stepId,
        });
      }

      // ---- walls -----------------------------------------------------------
      // fork bar (top): sun-lit full width + small ruler notches at the interior ticks
      litBar(g, cellX, cellY, cellW, WALL);
      const notch = svgEl("g", { "stroke-width": "0.7" });
      notch.style.stroke = "var(--ad-panel)";
      for (let t = step; t < axisMax - 1e-6; t += step){
        const nx = trackLeft + t * px;
        notch.appendChild(svgEl("line", { x1: nx, y1: cellY, x2: nx, y2: cellY + WALL }));
      }
      g.appendChild(notch);

      // join bar (bottom): segmented, leaving a clean gap at each resource disc-port x (Task 6 routes through)
      const joinY = cellBottom - WALL;
      const gapXs = ports.filter((p) => p.resourceType).map((p) => p.x).sort((a, b) => a - b);
      const join = svgEl("g");
      let segX = cellX;
      for (const gx of gapXs){
        const gs = gx - GAP / 2;
        if (gs > segX) litBar(join, segX, joinY, gs - segX, WALL);
        segX = gx + GAP / 2;
      }
      if (cellRight > segX) litBar(join, segX, joinY, cellRight - segX, WALL);
      g.appendChild(join);

      // left + right walls
      litBar(g, cellX, cellY, WALL, cellH);
      litBar(g, cellRight - WALL, cellY, WALL, cellH);

      // ---- disc ports (filled disc + faint halo), drawn on top of the walls ----
      for (const p of ports){
        const halo = svgEl("circle", { cx: p.x, cy: p.y, r: 4, fill: "none", "stroke-width": "0.8" });
        halo.style.stroke = p.color;
        halo.style.opacity = ".35";
        g.appendChild(halo);
        const disc = svgEl("circle", { cx: p.x, cy: p.y, r: 2.6 });
        disc.style.fill = p.color;
        g.appendChild(disc);
      }

      it.ports = ports;   // expose disc-port geometry for Task 6 (object-flow edges)
      return g;
    }

    // ---- object flow: entity cards + flow edges + ring/disc ports (the v17 grammar) -------------
    // For every created resource it draws: a producer port (fork lane disc — reused from buildForkCell
    // — or a node output disc on the producer's bottom edge), a content-sized entity CARD off the spine,
    // and uniform-width object-color S-curves producer -> card -> each consumer input ring. Wall
    // crossings are a straight pass through the clean join-wall gap Task 5 left at the disc x.
    //   Clamp/stack: node data ports clamp to PORT_INSET from the node's right edge and stack inward at
    //   PORT_PITCH (ordered by counterpart x so lines don't cross); the control edge owns the centre.
    // Returns { g, cards, edges } — `edges` is the rendered geometry/verb metadata for Task 7 (verb
    // labels) and Task 8 (collapse). See the report for the edge/card schema.
    function buildObjectFlow(sc, layout, rerender){
      const g = svgEl("g", { class: "ad-flow" });
      const flows = (layout.flows || []).map((f) => Object.assign({}, f));  // local copy (geometry added here)
      const cards = [], edges = [];
      if (!flows.length) return { g, cards, edges };

      const pushMap = (m, k, v) => { const a = m.get(k); if (a) a.push(v); else m.set(k, [v]); };
      // clamp data ports to a fixed inset from the node's right edge, stacking inward; assign .x in
      // counterpart-x order (left counterpart -> innermost slot) so producer/consumer lines don't cross.
      const clampStack = (it, entries) => {
        const right = it.x + it.w, n = entries.length;
        const sorted = entries.slice().sort((a, b) => a.cx - b.cx);
        sorted.forEach((e, i) => { e.x = right - PORT_INSET - (n - 1 - i) * PORT_PITCH; });
        return sorted;
      };

      // arrowhead marker per object colour (centreline aims at the ring centre; tip lands just outside)
      const flowDefs = svgEl("defs");
      g.appendChild(flowDefs);
      const markerCache = new Map();
      const markerFor = (color) => {
        if (markerCache.has(color)) return markerCache.get(color);
        const id = "ad-of-" + sc.scenarioId + "-" + markerCache.size;
        const m = svgEl("marker", {
          id, viewBox: "0 0 8 8", refX: "6.6", refY: "4",
          markerWidth: "3.6", markerHeight: "3.6", orient: "auto",
        });
        const p = svgEl("path", { d: "M0,0 L8,4 L0,8 z" });
        p.style.fill = color;
        m.appendChild(p);
        flowDefs.appendChild(m);
        markerCache.set(color, id);
        return id;
      };

      // 1) resolve producer points for ALL flows. Fork lanes already drew their disc (reuse it.ports);
      //    node producers get an output disc (tier-1 below; collapsed bundles synthesize one).
      for (const f of flows) f.color = typeColor(f.type);
      for (const f of flows){
        if (f.prodItem.kind === "fork"){
          const port = (f.prodItem.ports || []).find((p) => p.stepId === f.producerStepId);
          f.producerPt = port ? { x: port.x, y: port.y } : null;
          f.producerInFork = true;
        } else {
          f.producerInFork = false;
        }
      }

      // ---- collapse tiers (spec §4): group flows into producer bundles, decide a tier per bundle.
      //   Tier 1 = individual cards (current behavior); Tier 2 = one stack+badge per type (uniform
      //   verb); Tier 3 = a grey blank-header bundle + verb×count. Click a collapsed card -> expand
      //   ONE tier (3->2->1) via the per-scenario expansion level, then re-layout the scenario.
      const expMap = expansionFor(sc.scenarioId);
      const repVerb = (f) => {                          // a resource's representative verb for uniformity
        const cv = (f.consumers || []).map((c) => (c.verb || "").toLowerCase());
        if (!cv.length) return (f.createVerb || "create").toLowerCase();
        return new Set(cv).size === 1 ? cv[0] : "@mixed";
      };
      const bundleMap = new Map();
      for (const f of flows){
        let b = bundleMap.get(f.prodItem);
        if (!b){ b = { key: f.prodItem.steps.map((s) => s.stepId).sort().join("|"), prodItem: f.prodItem, flows: [] };
          bundleMap.set(f.prodItem, b); }
        b.flows.push(f);
      }
      const bundles = [...bundleMap.values()];
      for (const b of bundles){
        const decided = tierBundle(b.flows.map((f) => ({ type: f.type, verb: repVerb(f) })));
        b.natural = decided.tier;
        b.tier = Math.max(1, decided.tier - (expMap.get(b.key) || 0));
      }
      const collapsedFlows = new Set();
      for (const b of bundles) if (b.tier > 1) for (const f of b.flows) collapsedFlows.add(f);
      const tier1Flows = flows.filter((f) => !collapsedFlows.has(f));
      const tier1Cards = [];

      // node producers (tier 1): output disc clamp/stacked on the producing node's bottom edge.
      const nodeOut = new Map();
      for (const f of tier1Flows) if (!f.producerInFork) pushMap(nodeOut, f.prodItem, f);
      for (const [it, fs] of nodeOut){
        const placed = clampStack(it, fs.map((f, i) => ({ f, cx: i })));   // stable order; counterpart unknown
        for (const e of placed) e.f.producerPt = { x: e.x, y: it.y + it.h };
      }

      // 2) entity cards (tier 1). Fork-produced cards form ONE row below the cell (packed, centred on
      //    the disc centroid); a node's cards sit just below it. Both clear the spine + stay in-band.
      const byFork = new Map();
      for (const f of tier1Flows) if (f.producerInFork && f.producerPt) pushMap(byFork, f.prodItem, f);
      for (const [it, fs] of byFork){
        fs.sort((a, b) => a.producerPt.x - b.producerPt.x);
        const boxes = fs.map((f) => Object.assign({ f }, cardBox(f.type, f.key)));
        const totalW = boxes.reduce((s, b) => s + b.w, 0) + (boxes.length - 1) * CARD_HGAP;
        const centroid = fs.reduce((s, f) => s + f.producerPt.x, 0) / fs.length;
        let left = centroid - totalW / 2;
        left = Math.max(AD_MARGIN + 6, Math.min(left, AD_W - AD_MARGIN - 6 - totalW));
        const top = it.y + it.h + CARD_GAP_TOP;
        let x = left;
        for (const b of boxes){
          const card = { type: b.f.type, key: b.f.key, color: b.f.color, x, y: top, w: b.w, h: b.h, cx: x + b.w / 2 };
          b.f.card = card; cards.push(card); tier1Cards.push(card); x += b.w + CARD_HGAP;
        }
      }
      for (const f of tier1Flows){
        if (f.producerInFork || !f.producerPt || f.card) continue;
        const b = cardBox(f.type, f.key);
        // corridor x: by default below the output disc; if the straight drop to the nearest consumer
        // would cross an intervening node, slide the card (and thus its line) right to clear it.
        let corridor = f.producerPt.x;
        const prod = f.prodItem, prodBot = prod.y + prod.h;
        const isConsumer = (it) => f.consumers.some((c) => c.item === it);
        const lowestTop = f.consumers.length ? Math.min(...f.consumers.map((c) => c.item.y)) : Infinity;
        for (const it2 of layout.items){
          if (it2 === prod || isConsumer(it2)) continue;
          if (it2.y + it2.h > prodBot && it2.y < lowestTop && corridor <= it2.x + it2.w + 6)
            corridor = Math.max(corridor, it2.x + it2.w + 10 + b.w / 2);
        }
        let x = corridor - b.w / 2;
        x = Math.max(AD_MARGIN + 6, Math.min(x, AD_W - AD_MARGIN - 6 - b.w));
        const top = prodBot + CARD_GAP_TOP;
        const card = { type: f.type, key: f.key, color: f.color, x, y: top, w: b.w, h: b.h, cx: x + b.w / 2 };
        f.card = card; cards.push(card); tier1Cards.push(card);
      }

      // 3) consumer input rings (tier 1): clamp/stacked on each consuming node's top edge, by producer x.
      const ringNodes = new Map();
      for (const f of tier1Flows) for (const c of f.consumers){
        const cx = f.producerPt ? f.producerPt.x : (f.card ? f.card.cx : c.item.x + c.item.w);
        pushMap(ringNodes, c.item, { f, c, cx });
      }
      for (const [it, entries] of ringNodes){
        const placed = clampStack(it, entries);
        for (const e of placed) e.c.ring = { x: e.x, y: it.y };
      }

      // 4) draw (tier 1) — lines first (under the cards), then cards, then ports (rings/discs) on top.
      // emphEls = { el, objKey } for hover-emphasis (data-obj="type:key" per resource).
      // CSS .ad-flow.has-em rules handle dim/bright via !important; halos excluded (stay at .35).
      const emphEls = [];
      const tagObj = (el, objKey) => { el.dataset.obj = objKey; emphEls.push({ el, objKey }); return el; };
      const lineG = svgEl("g", { fill: "none", "stroke-linecap": "round", "stroke-width": "1.3" });
      // Per-path opacity (was lineG.style.opacity=".9") so CSS !important can override on hover.
      const addLine = (d, color, head, objKey) => {
        const p = svgEl("path", { d });
        p.style.stroke = color;
        p.style.opacity = ".9";
        if (head) p.setAttribute("marker-end", "url(#" + markerFor(color) + ")");
        lineG.appendChild(p);
        if (objKey) tagObj(p, objKey);
        return p;
      };
      for (const f of tier1Flows){
        if (!f.producerPt || !f.card) continue;
        const objKey = f.type + ":" + String(f.key);
        // producer -> card: straight down through the join-wall gap (fork), then a gentle curve in.
        const throughY = f.producerInFork ? f.prodItem.y + f.prodItem.h : f.producerPt.y;
        f.producerPathD = producerToCardPath(f.producerPt, f.card, throughY);
        addLine(f.producerPathD, f.color, false, objKey);
        edges.push({
          kind: "produce", verb: f.createVerb, type: f.type, key: f.key, color: f.color,
          stepId: f.producerStepId, from: { x: f.producerPt.x, y: f.producerPt.y },
          to: { x: f.card.cx, y: f.card.y }, card: f.card, pathD: f.producerPathD,
          mid: { x: (f.producerPt.x + f.card.cx) / 2, y: (f.producerPt.y + f.card.y) / 2 },
        });
        // card -> each consumer ring: S-curve with a short straight tail so the arrowhead lands square.
        for (const c of f.consumers){
          if (!c.ring) continue;
          const x1 = f.card.cx, y1 = f.card.y + f.card.h;
          const d = flowEdgeDown(x1, y1, c.ring.x, c.ring.y);
          addLine(d, f.color, true, objKey);
          edges.push({
            kind: "consume", verb: c.verb, type: f.type, key: f.key, color: f.color,
            stepId: c.stepId, from: { x: x1, y: y1 }, to: { x: c.ring.x, y: c.ring.y },
            card: f.card, ring: c.ring, pathD: d,
            mid: { x: (x1 + c.ring.x) / 2, y: (y1 + c.ring.y) / 2 },
          });
        }
      }
      g.appendChild(lineG);
      for (const card of tier1Cards){
        const objKey = card.type + ":" + String(card.key);
        const cardG = cardEl(card, sc.scenarioId);
        tagObj(cardG, objKey);
        g.appendChild(cardG);
      }
      for (const f of tier1Flows) for (const c of f.consumers){
        if (!c.ring) continue;
        const objKey = f.type + ":" + String(f.key);
        const ring = svgEl("circle", { cx: c.ring.x, cy: c.ring.y, r: RING_R, fill: "none", "stroke-width": "1.3" });
        ring.style.stroke = f.color;
        tagObj(ring, objKey);
        g.appendChild(ring);
      }
      for (const f of tier1Flows){
        if (f.producerInFork || !f.producerPt) continue;
