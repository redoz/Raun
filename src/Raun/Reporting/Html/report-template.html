        const objKey = f.type + ":" + String(f.key);
        // halo: decorative; excluded from emphEls so it stays at .35 even when others are dimmed.
        const halo = svgEl("circle", { cx: f.producerPt.x, cy: f.producerPt.y, r: HALO_R, fill: "none", "stroke-width": "0.8" });
        halo.style.stroke = f.color; halo.style.opacity = ".35";
        g.appendChild(halo);
        const disc = svgEl("circle", { cx: f.producerPt.x, cy: f.producerPt.y, r: DISC_R });
        disc.style.fill = f.color;
        tagObj(disc, objKey);
        g.appendChild(disc);
      }

      // 5) verb labels (tier 1) — the placement ladder (spec §3.2).
      placeVerbLabels(edges, cards, layout, g);

      // 6) collapsed bundles (Tier 2 stack+badge per type / Tier 3 grey blank-header bundle + verb×count).
      const collapsed = bundles.filter((b) => b.tier > 1);
      if (collapsed.length){
        const cLineG = svgEl("g", { fill: "none", "stroke-linecap": "round", "stroke-width": "1.3" });
        cLineG.style.opacity = ".9";
        const cCardEls = [];          // collapsed card <g>s (drawn above the lines)
        const discList = [];          // node-producer discs to draw (fork discs already drawn by the cell)
        const portsG = svgEl("g"), labelsG = svgEl("g");
        const consSpecs = [];         // deferred consumer edges (need cross-item ring clamp/stack)
        const sampleKey = (k) => (k == null ? "" : String(k)) + "…";
        const tally = (verbs) => {    // [verb,…] -> [[verb,count],…] sorted by count desc
          const m = new Map();
          for (const v of verbs){ const k = (v || "").toLowerCase(); m.set(k, (m.get(k) || 0) + 1); }
          return [...m.entries()].sort((a, b) => b[1] - a[1]);
        };
        const drawVb = (text, color, x, y, grey) => {
          const t = svgEl("text", { class: grey ? "ad-gv" : "ad-vb", x, y, "text-anchor": "middle", "dominant-baseline": "central" });
          if (!grey) t.style.fill = labelColor(color);
          t.textContent = text;
          labelsG.appendChild(t);
        };
        // producer disc(s) for a set of flows: fork -> distinct lane discs (already on-canvas);
        // node -> one synthesized output disc at the node's bottom centre (marked .node so it's drawn).
        const discsFor = (it, fs, cellBottom) => {
          if (it.kind === "fork"){
            const seen = new Map();
            for (const f of fs) if (f.producerPt) seen.set(f.producerStepId, f.producerPt);
            return [...seen.values()];
          }
          return [{ x: it.x + it.w / 2, y: cellBottom, node: true }];
        };
        const centroid = (pts, fbx, fby) =>
          pts.length ? { x: pts.reduce((s, p) => s + p.x, 0) / pts.length, y: pts.reduce((s, p) => s + p.y, 0) / pts.length }
                     : { x: fbx, y: fby };

        for (const b of collapsed){
          const it = b.prodItem, cellBottom = it.y + it.h, top = cellBottom + CARD_GAP_TOP;
          const onClick = (ev) => { ev.stopPropagation(); expMap.set(b.key, (expMap.get(b.key) || 0) + 1); if (rerender) rerender(); };

          if (b.tier === 2){
            // one stack per type, laid in a row centred on the bundle's disc centroid.
            const byType = new Map();
            for (const f of b.flows) pushMap(byType, f.type, f);
            const groups = [...byType.entries()].map(([type, fs]) => {
              const box = cardBox(type, sampleKey(fs[0].key));
              return { type, fs, color: fs[0].color, w: box.w, h: box.h };
            });
            const totalW = groups.reduce((s, gp) => s + gp.w, 0) + (groups.length - 1) * CARD_HGAP;
            const cen = centroid(discsFor(it, b.flows, cellBottom), it.x + it.w / 2, cellBottom);
            let left = cen.x - totalW / 2;
            left = Math.max(AD_MARGIN + 6, Math.min(left, AD_W - AD_MARGIN - 6 - totalW));
            let x = left;
            for (const gp of groups){
              const card = { type: gp.type, key: sampleKey(gp.fs[0].key), color: gp.color,
                x, y: top, w: gp.w, h: gp.h, cx: x + gp.w / 2, collapsed: 2, count: gp.fs.length, bundle: b };
              cards.push(card); cCardEls.push(stackCardEl(card, onClick, sc.scenarioId));
              // producer edge from this type's disc centroid -> card top (colored).
              const tDiscs = discsFor(it, gp.fs, cellBottom);
              const pc = centroid(tDiscs, card.cx, cellBottom);
              const pPath = producerToCardPath(pc, card, cellBottom);
              const pl = svgEl("path", { d: pPath }); pl.style.stroke = gp.color; cLineG.appendChild(pl);
              if (tDiscs.some((d) => d.node)) discList.push({ x: pc.x, y: cellBottom, color: gp.color });
              drawVb((gp.fs[0].createVerb || "create").toLowerCase(), gp.color, (pc.x + card.cx) / 2, (pc.y + top) / 2, false);
              edges.push({ kind: "produce", verb: gp.fs[0].createVerb, type: gp.type, color: gp.color, tier: 2, count: card.count, card, pathD: pPath });
              // consumer edge(s): one per distinct consumer item, carrying that type-group's verb(s).
              const consByItem = new Map();
              for (const f of gp.fs) for (const c of f.consumers) pushMap(consByItem, c.item, c.verb);
              for (const [citem, verbs] of consByItem)
                consSpecs.push({ card, item: citem, color: gp.color, grey: false, verbCounts: tally(verbs), cx: card.cx });
              x += gp.w + CARD_HGAP;
            }
          } else {
            // Tier 3 — ONE grey blank-header bundle for the whole producer bundle.
            const box = cardBox("XXXXXX", "");
            const allDiscs = discsFor(it, b.flows, cellBottom);
            let ccx = centroid(allDiscs, it.x + it.w / 2, cellBottom).x;
            ccx = Math.max(AD_MARGIN + 6 + box.w / 2, Math.min(ccx, AD_W - AD_MARGIN - 6 - box.w / 2));
            const card = { type: "", key: "", color: "var(--ad-grey)", x: ccx - box.w / 2, y: top,
              w: box.w, h: box.h, cx: ccx, collapsed: 3, count: b.flows.length, bundle: b };
            cards.push(card); cCardEls.push(greyCardEl(card, onClick, sc.scenarioId));
            // grey producer edge(s): one per distinct producer disc (each passes its join-wall gap).
            for (const d of allDiscs){
              const pl = svgEl("path", { d: producerToCardPath(d, card, cellBottom) });
              pl.style.stroke = "var(--ad-grey)"; pl.style.opacity = ".75"; cLineG.appendChild(pl);
              if (d.node) discList.push({ x: d.x, y: cellBottom, color: "var(--ad-grey-badge)" });
            }
            // producer-side tally (create ×N), stacked above the card.
            const pTally = tally(b.flows.map((f) => f.createVerb));
            pTally.forEach(([v, n], i) => drawVb(v + " ×" + n, null, card.cx + 2, top - 8 - i * 9, true));
            edges.push({ kind: "produce", type: "*", color: "var(--ad-grey)", tier: 3, count: card.count, card, verbCounts: pTally });
            // grey consumer edge(s): one per distinct consumer item (no per-edge label).
            const consByItem = new Map();
            for (const f of b.flows) for (const c of f.consumers) pushMap(consByItem, c.item, c.verb);
            for (const [citem] of consByItem)
              consSpecs.push({ card, item: citem, color: "var(--ad-grey)", grey: true, verbCounts: null, cx: card.cx });
            // one shared consumer-side verb×count tally for the whole bundle, stacked below the card.
            const cTally = tally([...consByItem.values()].flat());
            cTally.forEach(([v, n], i) => drawVb(v + " ×" + n, null, card.cx, top + card.h + 9 + i * 9, true));
          }
        }

        // consumer rings: clamp/stack across all collapsed consume edges per consuming node.
        const cRingMap = new Map();
        for (const cs of consSpecs) pushMap(cRingMap, cs.item, cs);
        for (const [item, specs] of cRingMap){
          const placed = clampStack(item, specs.map((s) => ({ s, cx: s.cx })));
          for (const e of placed) e.s.ring = { x: e.x, y: item.y };
        }
        for (const cs of consSpecs){
          if (!cs.ring) continue;
          const x1 = cs.card.cx, y1 = cs.card.y + cs.card.h;
          const pl = svgEl("path", { d: flowEdgeDown(x1, y1, cs.ring.x, cs.ring.y) });
          pl.style.stroke = cs.color;
          if (cs.grey) pl.style.opacity = ".75";
          pl.setAttribute("marker-end", "url(#" + markerFor(cs.color) + ")");
          cLineG.appendChild(pl);
          const ring = svgEl("circle", { cx: cs.ring.x, cy: cs.ring.y, r: RING_R, fill: "none", "stroke-width": "1.3" });
          ring.style.stroke = cs.color; portsG.appendChild(ring);
          // tier-2 consumer verb label(s) per edge (tier-3 uses the shared bundle tally drawn above).
          if (cs.verbCounts)
            cs.verbCounts.forEach(([v, n], i) =>
              drawVb(cs.verbCounts.length > 1 ? v + " ×" + n : v, cs.color, x1, y1 + 9 + i * 9, false));
        }

        // node-producer discs (fork discs were already drawn by buildForkCell)
        for (const d of discList){
          const halo = svgEl("circle", { cx: d.x, cy: d.y, r: HALO_R, fill: "none", "stroke-width": "0.8" });
          halo.style.stroke = d.color; halo.style.opacity = ".35"; portsG.appendChild(halo);
          const disc = svgEl("circle", { cx: d.x, cy: d.y, r: DISC_R }); disc.style.fill = d.color; portsG.appendChild(disc);
        }

        g.appendChild(cLineG);
        for (const cel of cCardEls) g.appendChild(cel);
        g.appendChild(portsG);
        g.appendChild(labelsG);
      }

      // ---- hover emphasis: mouseover/mouseout delegated on the flow group ----
      // CSS .ad-flow.has-em handles dim (.22 !important) / bright (1 !important) via data-obj + .em.
      // Moving between elements of the same object keeps emphasis; leaving the group clears it.
      if (emphEls.length){
        let emphObj = null;
        const setEmph = (targetObj) => {
          if (targetObj === emphObj) return;
          emphObj = targetObj;
          g.classList.toggle("has-em", targetObj != null);
          for (const { el, objKey } of emphEls)
            el.classList.toggle("em", targetObj != null && objKey === targetObj);
        };
        g.addEventListener("mouseover", (ev) => {
          const t = ev.target && ev.target.closest ? ev.target.closest("[data-obj]") : null;
          if (t) setEmph(t.dataset.obj);
        });
        g.addEventListener("mouseout", (ev) => {
          if (!emphObj) return;
          const rel = ev.relatedTarget;
          if (rel && rel.closest){
            const t = rel.closest("[data-obj]");
            if (t && t.dataset.obj === emphObj) return;
          }
          setEmph(null);
        });
      }

      return { g, cards, edges };
    }

    // ---- verb-label placement ladder (spec §3.2) -----------------------------------------------
    // Drops a .ad-vb verb (italic 500 / 5.5 / bg-knockout halo 2.4) on every object-flow edge.
    // Anchors on the TRUE on-path midpoint (getPointAtLength, not the Euclidean edge.mid which drifts
    // off S-curves), centered in the longest collision-free run of the wire; steps along the path
    // normal on collision; draws a dashed leader only when boxed-in past a threshold with something
    // crowding the wire. Greedy single pass; later labels dodge earlier ones. (VB_* consts up top.)
    function placeVerbLabels(edges, cards, layout, g){
      if (!edges.length) return;
      const cx0 = AD_W / 2;
      // static obstacles: entity cards, fork cells, action/assert nodes
      const obstacles = [], cellRects = [];
      for (const c of cards) obstacles.push({ x: c.x, y: c.y, w: c.w, h: c.h });
      for (const it of layout.items || []){
        const r = { x: it.x, y: it.y, w: it.w, h: it.h };
        if (it.kind === "fork"){ obstacles.push(r); cellRects.push(r); }
        else if (it.kind === "node") obstacles.push(r);
      }
      // ports (discs/rings): not hard collisions (the wire threads them) but count for the leader test
      const portRects = [];
      for (const e of edges){
        if (e.ring) portRects.push(ptRect(e.ring, RING_R + 0.5));
        portRects.push(ptRect(e.from, DISC_R + 0.5));
      }
      const placed = [];                              // boxes of labels already dropped this pass
      const overlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
      const boxAt = (x, y, halfW) => ({ x: x - halfW, y: y - VB_HALF_H, w: 2 * halfW, h: 2 * VB_HALF_H });
      const blocked = (box) => obstacles.some((o) => overlap(box, o)) || placed.some((o) => overlap(box, o));
      const clearTo = (a, o) => {
        const dx = Math.max(o.x - (a.x + a.w), a.x - (o.x + o.w));
        const dy = Math.max(o.y - (a.y + a.h), a.y - (o.y + o.h));
        return Math.max(dx, dy);
      };
      const clearance = (box) => {
        let m = Infinity;
        for (const o of obstacles){ const c = clearTo(box, o); if (c < m) m = c; }
        for (const o of placed){ const c = clearTo(box, o); if (c < m) m = c; }
        return m;
      };
      const segBlocked = (x1, y1, x2, y2) => {        // does any obstacle/port/label cross this leader?
        for (let i = 1; i < 6; i++){
          const t = i / 6, px = x1 + (x2 - x1) * t, py = y1 + (y2 - y1) * t;
          const hit = (o) => px > o.x && px < o.x + o.w && py > o.y && py < o.y + o.h;
          if (obstacles.some(hit) || portRects.some(hit) || placed.some(hit)) return true;
        }
        return false;
      };

      const leaderG = svgEl("g", { class: "ad-vb-leaders", fill: "none", "stroke-width": "0.7", "stroke-dasharray": "2.2 1.8" });
      leaderG.style.opacity = ".75";
      const textG = svgEl("g", { class: "ad-vb-labels" });

      const drop = (verb, color, x, y, halfW, leaderFrom) => {
        const t = svgEl("text", { class: "ad-vb", x, y, "text-anchor": "middle", "dominant-baseline": "central" });
        t.style.fill = labelColor(color);
        // knockout halo = the LOCAL background: cell where the verb sits inside a fork cell, else panel
        if (cellRects.some((r) => x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h))
          t.style.stroke = "var(--ad-cell)";
        t.textContent = verb;
        if (leaderFrom){
          const ld = svgEl("path", { d: "M" + leaderFrom.x + "," + leaderFrom.y + " L" + x + "," + y });
          ld.style.stroke = labelColor(color);
          leaderG.appendChild(ld);
        }
        textG.appendChild(t);
        placed.push(boxAt(x, y, halfW));
      };

      for (const e of edges){
        const verb = (e.verb || "").toLowerCase();   // locked visual is lowercase (spec §3 / labels-r3)
        if (!verb) continue;
        const halfW = measureText(verb, VB_FS, 500, true) / 2 + VB_PAD_X;
        // sample the actual rendered path: position + unit normal at N points along its length
        const probe = withPath(e.pathD, (p) => {
          const L = p.getTotalLength();
          if (!L || !isFinite(L)) return null;
          const N = 28, eps = Math.max(0.4, Math.min(2, L / (N * 1.5))), pts = [];
          const at = (s) => { const q = p.getPointAtLength(Math.max(0, Math.min(L, s))); return { x: q.x, y: q.y }; };
          for (let i = 0; i <= N; i++){
            const s = (i / N) * L, c = at(s), a = at(s - eps), b = at(s + eps);
            const tx = b.x - a.x, ty = b.y - a.y, tl = Math.hypot(tx, ty) || 1;
            pts.push({ x: c.x, y: c.y, nx: -ty / tl, ny: tx / tl });
          }
          return pts;
        });
        if (!probe){ drop(verb, e.color, e.mid.x, e.mid.y, halfW, null); continue; }

        // ① on the line: center in the LONGEST collision-free run of the wire (halo tolerates a short
        //    run — step ②); tie-break toward the path midpoint.
        const clear = probe.map((a) => !blocked(boxAt(a.x, a.y, halfW)));
        const midIdx = probe.length >> 1;
        let run = null, start = -1;
        for (let i = 0; i <= probe.length; i++){
          if (i < probe.length && clear[i]){ if (start < 0) start = i; }
          else if (start >= 0){
            const a = start, b = i - 1, mid = (a + b) / 2, score = (b - a) * 1000 - Math.abs(mid - midIdx);
            if (!run || score > run.score) run = { mid, score };
            start = -1;
          }
        }
        if (run){ const a = probe[Math.round(run.mid)]; drop(verb, e.color, a.x, a.y, halfW, null); continue; }

        // ③ collision: step along the path normal from the midpoint, preferring the side that points
        //    away from the spine (toward the open margin); take the first clear offset.
        const base = probe[midIdx];
        const sides = ((base.nx >= 0) === (base.x >= cx0)) ? [1, -1] : [-1, 1];
        let bestSpot = null, bestClr = -Infinity;
        let doneNormal = false;
        for (const d of [4, 7, 10, 13, 16, 20, 24]){
          for (const s of sides){
            const x = base.x + base.nx * d * s, y = base.y + base.ny * d * s, box = boxAt(x, y, halfW);
            const clr = clearance(box);
            if (clr >= 0){ drop(verb, e.color, x, y, halfW, null); doneNormal = true; break; }
            if (clr > bestClr){ bestClr = clr; bestSpot = { x, y, d }; }
          }
          if (doneNormal) break;
        }
        if (doneNormal) continue;

        // ④ boxed in: least-bad spot + a dashed leader back to the wire — but only when displaced past
        //    the threshold AND a label/port sits between the verb and its wire (else it floats clean).
        const sp = bestSpot || { x: base.x, y: base.y, d: 0 };
        const wantLeader = sp.d >= VB_LEADER_MIN && segBlocked(base.x, base.y, sp.x, sp.y);
        drop(verb, e.color, sp.x, sp.y, halfW, wantLeader ? base : null);
      }

      g.appendChild(leaderG);
      g.appendChild(textG);
    }
    // a small axis-aligned rect centered on a point (for port obstacles).
    function ptRect(p, r){ return { x: p.x - r, y: p.y - r, w: 2 * r, h: 2 * r }; }
    // run a fn with a temp <path d=...> attached to the hidden measure SVG so getTotalLength /
    // getPointAtLength are available; the path is removed afterwards (geometry only, never rendered).
    function withPath(d, fn){
      const p = svgEl("path", { d });
      measureSvg().appendChild(p);
      let r = null;
      try { r = fn(p); } catch (e) { r = null; } finally { p.remove(); }
      return r;
    }

    // content-sized entity card: measured type header + identifier, both with horizontal padding.
    function cardBox(type, key){
      const t = (type || "").toUpperCase();
      const tw = measureText(t, CARD_TYPE_FS, 600) + Math.max(0, t.length - 1) * CARD_TYPE_FS * 0.05;
      const kw = measureText(key == null ? "" : String(key), CARD_KEY_FS, 400);
      const w = Math.max(CARD_MINW, Math.round(Math.max(tw, kw) + 2 * CARD_PADX));
      return { w, h: CARD_H };
    }
    // a card <g>: sun-lit --ad-card body (rx 1) under a colored type-header band; .ad-oth type + .ad-okn key.
    // sid = scenario id for the per-svg sheen/glint (threaded from buildObjectFlow).
    function cardEl(card, sid){
      return litTile({
        x: card.x, y: card.y, w: card.w, h: card.h, rx: 1, sid, sw: "1.1", gloss: false,
        fill: [{ o: 0, c: "var(--ad-card)" }, { o: 1, c: "var(--ad-card)", op: 0.95 }],
        border: [{ o: 0, c: "var(--ad-card-border-hi, var(--ad-wall))" }, { o: 1, c: "var(--ad-card-border)" }],
        label: "object " + (card.type || "") + " " + (card.key == null ? "" : card.key),
        body: (g) => {
          const hdr = svgEl("rect", { x: card.x, y: card.y, width: card.w, height: CARD_HEADER_H, rx: 1 });
          hdr.style.fill = card.color;
          g.appendChild(hdr);
          const tt = svgEl("text", { class: "ad-oth", x: card.x + card.w / 2, y: card.y + CARD_HEADER_H / 2 + 0.3, "text-anchor": "middle", "dominant-baseline": "central" });
          tt.style.fontSize = CARD_TYPE_FS + "px"; tt.style.fill = contrastInk(card.color);
          tt.textContent = (card.type || "").toUpperCase();
          g.appendChild(tt);
          const kt = svgEl("text", { class: "ad-okn", x: card.x + card.w / 2, y: card.y + CARD_HEADER_H + (card.h - CARD_HEADER_H) / 2, "text-anchor": "middle", "dominant-baseline": "central" });
          kt.style.fontSize = CARD_KEY_FS + "px";
          kt.textContent = card.key == null ? "" : String(card.key);
          g.appendChild(kt);
        },
      });
    }
    // Tier-2 collapsed card: a normal entity card (one per type) drawn as a small STACK (two offset
    // cards behind, up-right) with a corner COUNT BADGE (object-color circle + count). card.key is a
    // sample identifier (e.g. "Jane…"). The whole <g> is the click-to-expand target.
    function stackCardEl(card, onClick, sid){
      const g = svgEl("g");
      g.style.cursor = "pointer";
      for (const off of [{ dx: 6, dy: -6 }, { dx: 3, dy: -3 }]){    // back cards (farthest first)
        const r = svgEl("rect", { x: card.x + off.dx, y: card.y + off.dy, width: card.w, height: card.h, rx: 1 });
        r.style.fill = "var(--ad-card)"; r.style.stroke = "var(--ad-card-border)"; r.setAttribute("stroke-width", "0.8");
        g.appendChild(r);
      }
      g.appendChild(cardEl(card, sid));                             // main (front) card
      const bx = card.x + card.w, by = card.y;                      // corner count badge (top-right)
      const circ = svgEl("circle", { cx: bx, cy: by, r: 7 });
      circ.style.fill = card.color; circ.style.stroke = "var(--ad-panel)"; circ.setAttribute("stroke-width", "1.3");
      g.appendChild(circ);
      const bt = svgEl("text", { class: "ad-bdg", x: bx, y: by + 0.2, "text-anchor": "middle", "dominant-baseline": "central" });
      bt.style.fill = contrastInk(card.color); bt.textContent = String(card.count);
      g.appendChild(bt);
      if (onClick){
        g.addEventListener("click", onClick);
        g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); onClick(ev); } });
      }
      return g;
    }
    // Tier-3 collapsed card: a card in the NORMAL shape but greyed — a grey blank header band (no
    // text), blank body, grey count badge (total), grey stack behind. The whole <g> is the click target.
    function greyCardEl(card, onClick, sid){
      const g = svgEl("g");
      g.style.cursor = "pointer";
      for (const off of [{ dx: 6, dy: -6 }, { dx: 3, dy: -3 }]){    // grey stack behind (hint of "many")
        const r = svgEl("rect", { x: card.x + off.dx, y: card.y + off.dy, width: card.w, height: card.h, rx: 1 });
        r.style.fill = "var(--ad-card)"; r.style.stroke = "var(--ad-grey)"; r.setAttribute("stroke-width", "0.8"); r.style.opacity = ".9";
        g.appendChild(r);
      }
      g.appendChild(litTile({
        x: card.x, y: card.y, w: card.w, h: card.h, rx: 1, sid, sw: "1", gloss: false,
        fill: [{ o: 0, c: "var(--ad-card)" }, { o: 1, c: "var(--ad-card)", op: 0.95 }],
        border: [{ o: 0, c: "var(--ad-grey)" }, { o: 1, c: "var(--ad-grey)", op: 0.6 }],
        label: "collapsed bundle of " + card.count + " objects",
        body: (gg) => {
          const hdr = svgEl("rect", { x: card.x, y: card.y, width: card.w, height: CARD_HEADER_H, rx: 1 });
          hdr.style.fill = "var(--ad-grey)";                       // blank grey header (no text)
          gg.appendChild(hdr);
        },
      }));
      const bx = card.x + card.w, by = card.y;                      // grey count badge (top-right)
      const circ = svgEl("circle", { cx: bx, cy: by, r: 7 });
      circ.style.fill = "var(--ad-grey-badge)"; circ.style.stroke = "var(--ad-panel)"; circ.setAttribute("stroke-width", "1.3");
      g.appendChild(circ);
      const bt = svgEl("text", { class: "ad-bdg", x: bx, y: by + 0.2, "text-anchor": "middle", "dominant-baseline": "central" });
      bt.style.fill = "var(--ad-panel)"; bt.textContent = String(card.count);
      g.appendChild(bt);
      if (onClick){
        g.addEventListener("click", onClick);
        g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); onClick(ev); } });
      }
      return g;
    }
    // producer disc -> card top: straight down to throughY (passes through the join-wall gap for a fork
    // producer), then a vertical-tangent cubic into the card's top centre (no arrowhead — the disc is the source).
    function producerToCardPath(P, card, throughY){
      const x1 = P.x, y1 = P.y, x2 = card.cx, y2 = card.y;
      const sy = throughY == null ? y1 : Math.max(y1, throughY);
      if (Math.abs(x2 - x1) < 0.5) return "M" + x1 + "," + y1 + " V" + y2;
      const dy = y2 - sy;
      return "M" + x1 + "," + y1 + " V" + sy +
        " C" + x1 + "," + (sy + dy * 0.5) + " " + x2 + "," + (y2 - dy * 0.5) + " " + x2 + "," + y2;
    }
    // card bottom -> consumer ring: vertical-tangent S-curve ending in a short straight tail so the
    // arrowhead arrives square; tip lands just outside the ring, centreline through the ring centre.
    function flowEdgeDown(x1, y1, x2, y2){
      const ringTop = y2 - RING_R - 0.5;            // where the tip should land (just above the ring)
      if (ringTop <= y1 + 2){
        const my = (y1 + ringTop) / 2;
        return "M" + x1 + "," + y1 + " C" + x1 + "," + my + " " + x2 + "," + my + " " + x2 + "," + ringTop;
      }
      const tail = Math.max(3, Math.min(7, (ringTop - y1) * 0.3));
      const ye = ringTop - tail, dy = ye - y1;
      return "M" + x1 + "," + y1 +
        " C" + x1 + "," + (y1 + dy * 0.55) + " " + x2 + "," + (ye - dy * 0.55) + " " + x2 + "," + ye +
        " L" + x2 + "," + ringTop;
    }

    // renderScenario(sc) -> <section>; returns the section and rebuilds it in place when a collapsed
    // object-flow node is clicked (expand-one-tier re-layout). The section identity is swapped on
    // rerender via parentNode.replaceChild, so the diagram re-lays-out without disturbing the page.
    function renderScenario(sc){
      let section;
      function rerender(){
        const fresh = buildScenarioCard(sc, rerender);
        if (section && section.parentNode) section.parentNode.replaceChild(fresh, section);
        section = fresh;
      }
      section = buildScenarioCard(sc, rerender);
      return section;
    }

    // buildScenarioCard(sc, rerender) -> <section> with the header, the <svg class="actdiag">
    // (buildActivityDiagram), and the per-scenario drill panel <div class="drill">
    // (buildScenarioDrill, unchanged).
    function buildScenarioCard(sc, rerender){
      const card = el("section", "card s-" + sc.status);

      // header
      const head = el("div", "card-head");
      const waited = sc.waitedMs > 0
        ? '<div class="cls">waited ' + fmtDur(sc.waitedMs) + " for " + esc(sc.waitedFor || "") + "</div>"
        : "";
      head.innerHTML =
        '<div class="card-title">' +
          '<div class="name">' + esc(sc.displayName) + "</div>" +
          '<div class="cls">' + esc(sc.classDisplayName || "") +
            ' <span class="mth mono">· ' + esc(sc.methodName) + "</span></div>" +
          waited +
        "</div>" +
        '<div class="card-meta">' +
          '<span class="dur">' + fmtDur(sc.durationMs) + "</span>" +
          '<span class="pill ' + sc.status + '"><span class="pd"></span>' + sc.status + "</span>" +
        "</div>";
      card.appendChild(head);

      // activity diagram (frame + centred spine + initial/final; interior nodes come in later tasks)
      if (SHOW_DIAGRAM) card.appendChild(buildActivityDiagram(sc, rerender));

      // one scenario-level drill panel: every step in run order
      const drill = buildScenarioDrill(sc);
      if (!SHOW_DIAGRAM) drill.classList.add("open");

      // open the panel and focus/scroll to a step; toggle closes when re-focusing the same step
      function focusStep(stepId, { toggle = false } = {}){
        const open = drill.classList.contains("open");
        const same = drill.dataset.focus === stepId;
        if (toggle && open && same){
          drill.classList.remove("open"); drill.dataset.focus = "";
          return false;
        }
        drill.classList.add("open"); drill.dataset.focus = stepId;
        for (const entry of drill.querySelectorAll(".step-entry"))
          entry.classList.toggle("focus", entry.dataset.step === stepId);
        const entry = drill.querySelector('.step-entry[data-step="' + stepId + '"]');
        if (entry) entry.scrollIntoView({ block: "nearest" });
        return true;
      }

      // node-click → focusStep: delegated listener on the actdiag SVG (built above).
      // Action/assert nodes carry data-step; collapsed-card handlers stop propagation so they don't fire.
      // Fork toggle: clicking a [data-fork-set] segment swaps that fork's view and rerenders.
      const onForkSet = (target) => {
        const seg = target && target.closest ? target.closest("[data-fork-set]") : null;
        if (!seg) return false;
        const fork = seg.closest(".ad-fork");
        if (fork){
          const key = fork.getAttribute("data-fork-key"), view = seg.getAttribute("data-fork-set");
          forkViewFor(sc.scenarioId).set(key, view);
          rerender();
          // rerender() replaceChild's the section, detaching the segment that had focus; restore keyboard
          // focus to the equivalent segment in the fresh card so the toggle stays operable (and :focus-within
          // re-reveals the pill). Harmless on mouse clicks (:focus-visible won't show for pointer focus).
          const fresh = [...document.querySelectorAll(".ad-fork")].find((f) => f.getAttribute("data-fork-key") === key);
          const seg2 = fresh && fresh.querySelector('[data-fork-set="' + view + '"]');
          if (seg2 && seg2.focus) seg2.focus();
        }
        return true;
      };
      const diagramSvg = card.querySelector("svg.actdiag");
      if (diagramSvg){
        diagramSvg.addEventListener("click", (ev) => {
          if (onForkSet(ev.target)) return;
          const target = ev.target && ev.target.closest ? ev.target.closest("[data-step]") : null;
          if (!target) return;
          focusStep(target.dataset.step, { toggle: true });
        });
        diagramSvg.addEventListener("keydown", (ev) => {
          if (ev.key !== "Enter" && ev.key !== " ") return;
          if (onForkSet(ev.target)){ ev.preventDefault(); return; }
          const target = ev.target && ev.target.closest ? ev.target.closest("[data-step]") : null;
          if (target){ focusStep(target.dataset.step, { toggle: true }); ev.preventDefault(); }
        });
      }

      const drillHost = el("div", "drill-host");
      drillHost.appendChild(drill);
      card.appendChild(drillHost);

      // opener for the pre-expand pass: open the drill focused on a step
      openers.push({ scenarioId: sc.scenarioId, open: (stepId) => focusStep(stepId) });

      return card;
    }

    // keyColor(type, key) -> a stable categorical slot per identifier, never the type's own slot and
    // never slot 8 (red reads as failure on a plain identifier); KEY_SLOTS lives beside CAT_SLOTS
    function keyColor(type, key){
      const ts = typeSlot(type);
      let slot = hashOf(key) % KEY_SLOTS;
      if (slot === ts) slot = (slot + 1) % KEY_SLOTS;
      return catVar(slot);
    }

    // resChip(type, key) -> clickable "Type:key" text, type in the type colour and key in the key colour;
    // data-res is the identity every chip for the same resource shares, which the click handler matches on.
    function resChip(type, key){
      const c = typeColor(type);
      return '<button type="button" class="res-chip" data-res="' + esc(type + ":" + key) + '"' +
        ' style="--rc:' + c + '" title="highlight every step touching ' + esc(type) + ":" + esc(key) + '">' +
        '<span class="rt" style="--c:' + c + '">' + esc(type) + '</span>:<span class="rk" style="--c:' + keyColor(type, key) + '">' + esc(key) + "</span></button>";
    }

    // logHtml(line) -> a "[resource] {Verb} {Type}: {key}" log line with the identity as a chip; any other line escaped as-is
    function logHtml(line){
      const m = RESOURCE_LINE.exec(line);
      if (!m) return esc(line);
      return esc(m[1] || "") + '<span class="lg-tag">[resource]</span> ' + esc(m[2]) + " " + resChip(m[3], m[4]);
    }

    // one delegated handler: clicking a chip highlights every chip for that resource and the steps holding them;
    // clicking a highlighted chip clears the highlight.
    report.addEventListener("click", (ev) => {
      const chip = ev.target && ev.target.closest ? ev.target.closest(".res-chip") : null;
      if (!chip) return;
      const id = chip.dataset.res, wasOn = chip.classList.contains("hl");
      for (const c of report.querySelectorAll(".res-chip.hl")) c.classList.remove("hl");
      for (const e of report.querySelectorAll(".step-entry.res-hit")){ e.classList.remove("res-hit"); e.style.removeProperty("--rc-hit"); }
      if (wasOn) return;
      for (const c of report.querySelectorAll(".res-chip")){
        if (c.dataset.res !== id) continue;
        c.classList.add("hl");
        const entry = c.closest(".step-entry");
        if (entry){ entry.classList.add("res-hit"); entry.style.setProperty("--rc-hit", c.style.getPropertyValue("--rc")); }
      }
    });

    // every step of a scenario, in run order, as one expandable list
    function buildScenarioDrill(sc){
      const p = el("div", "drill scenario-drill");
      p.dataset.focus = "";
      const hint = SHOW_DIAGRAM
        ? "All steps in run order — click a bar to jump to a step."
        : "All steps in run order — click a resource to highlight every step that touches it.";
      let h = '<div class="hint">' + hint + "</div>" +
              '<div class="step-list">';
      for (const s of sc.steps){
        h += '<div class="step-entry status-' + s.status + ' ph-' + s.phase.toLowerCase() + '" data-step="' + esc(s.stepId) + '">' +
          '<div class="step-head">' +
            '<span class="sx">#' + s.index + "</span>" +
            '<span class="ph-chip" style="background:' + (PHCOLOR[s.phase.toLowerCase()] || "var(--faint)") + '">' + esc(s.phase) + "</span>" +
            '<span class="dn">' + esc(s.displayName) + "</span>" +
            '<span class="pill ' + s.status + '"><span class="pd"></span>' + s.status + "</span>" +
            '<span class="dm">+' + s.offsetMs + "ms · " + fmtDur(s.durationMs) + "</span>" +
          "</div>";

        if (s.skipReason){
          h += '<div class="sec"><div class="skipnote">' + esc(s.skipReason) + "</div></div>";
        }
        if (s.logs && s.logs.length){
          h += '<div class="sec"><h4>Logs</h4><ol class="logs">' +
            s.logs.map((l) => "<li>" + logHtml(l) + "</li>").join("") + "</ol></div>";
        }
        if (s.traceId){
          h += '<div class="sec"><h4>Trace</h4><ol class="logs"><li>trace ' + esc(s.traceId) +
            (s.spanId ? " · span " + esc(s.spanId) : "") + "</li></ol></div>";
        }
        if (s.attachments && s.attachments.length){
          h += '<div class="sec"><h4>Attachments</h4>' +
            s.attachments.map((a) =>
              '<div class="att"><div class="an">' + esc(a.name) + '</div><pre class="exc">' + esc(a.value) + "</pre></div>"
            ).join("") + "</div>";
        }
        if (s.effects && s.effects.length){
          h += '<div class="sec"><h4>Effects</h4><div class="eff">' +
            s.effects.map((e) =>
              '<div class="e">' +
                '<span class="vd" style="background:' + (VCOLOR[e.verb.toLowerCase()] || "var(--faint)") + '"></span>' +
                '<span class="vb">' + esc(e.verb) + "</span>" +
                resChip(e.type, e.key) +
                '<span class="of">+' + e.offsetMs + "ms</span>" +
                (e.data ? '<span class="da">· ' + esc(e.data) + "</span>" : "") +
              "</div>"
            ).join("") + "</div></div>";
        }
        if (s.exception){
          h += '<div class="sec"><h4>Exception</h4><pre class="exc">' + esc(s.exception) + "</pre></div>";
        }
        h += "</div>";
      }
      h += "</div>";
      p.innerHTML = h;
      return p;
    }
  </script>
</body>
</html>
