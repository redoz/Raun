<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Raun run report</title>
<style>
:root{ --sans:"Segoe UI", system-ui, sans-serif; --surface-hover:color-mix(in srgb,var(--ink) 8%,var(--surface)); --mono:"Cascadia Code", ui-monospace, "SF Mono", Consolas, monospace; --ring:var(--accent); }

  /* ---------- LIGHT PALETTE (default) ---------- */
  :root{
    color-scheme: light;
    --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100; --cat-5:#e87ba4; --cat-6:#008300; --cat-7:#4a3aa7; --cat-8:#e34948;
    --bg:#eef1f5; --bg-grad:#e7ebf1;
    --surface:#ffffff; --surface-2:#f5f7fa; --inset:#eef1f4;
    --border:#e3e7ec; --border-strong:#d2d8df;
    --ink:#1b2027; --muted:#5b636e; --faint:#8b929c;
    --pass:#1a9c50; --fail:#d23636; --skip:#9a6b0c;
    --pass-text:#15803d; --fail-text:#b91c1c; --skip-text:#8a5e0a;
    --pass-bg:#e4f5ea; --fail-bg:#fbe8e8; --skip-bg:#f6edd6;
    --bar-pass:#22a35a; --bar-fail:#dc3b3b; --bar-skip:#a7740f; --bar-text:#ffffff;
    --ph-given:#2f74d0; --ph-when:#8350c4; --ph-then:#0c8576;
    --ph-given-ink:#2562c2; --ph-when-ink:#7237bd; --ph-then-ink:#0a7567;
    --v-create:#2563eb; --v-read:#0d9488; --v-edit:#e07a14; --v-delete:#9333ea;
    --accent:#3b62e8;
    --shadow:0 1px 2px rgba(17,24,39,.06), 0 6px 16px rgba(17,24,39,.06);
    --shadow-sm:0 1px 2px rgba(17,24,39,.07);
  }
  /* ---------- DARK PALETTE (auto) ---------- */
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300; --cat-7:#9085e9; --cat-8:#e66767;
      --bg:#0d1117; --bg-grad:#0b0f14;
      --surface:#161b22; --surface-2:#1b2230; --inset:#10151d;
      --border:#2a313c; --border-strong:#39414e;
      --ink:#e6edf3; --muted:#9aa4b0; --faint:#6c7682;
      --pass:#3fb950; --fail:#f0524a; --skip:#d4a13a;
      --pass-text:#56d364; --fail-text:#ff7b72; --skip-text:#e3b341;
      --pass-bg:rgba(63,185,80,.15); --fail-bg:rgba(240,82,74,.15); --skip-bg:rgba(212,161,58,.16);
      --bar-pass:#2ea043; --bar-fail:#da3633; --bar-skip:#b9842a; --bar-text:#ffffff;
      --ph-given:#3f82e6; --ph-when:#9a6ae0; --ph-then:#1aa48d;
      --ph-given-ink:#2562c2; --ph-when-ink:#7237bd; --ph-then-ink:#0a7567;
      --v-create:#4f8bff; --v-read:#2dd4bf; --v-edit:#f59e3c; --v-delete:#c07bf0;
      --accent:#5b86ff;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    }
  }
  /* ---------- EXPLICIT OVERRIDES (screenshot-deterministic) ---------- */
  :root[data-theme="light"]{
    color-scheme: light;
    --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100; --cat-5:#e87ba4; --cat-6:#008300; --cat-7:#4a3aa7; --cat-8:#e34948;
    --bg:#eef1f5; --bg-grad:#e7ebf1;
    --surface:#ffffff; --surface-2:#f5f7fa; --inset:#eef1f4;
    --border:#e3e7ec; --border-strong:#d2d8df;
    --ink:#1b2027; --muted:#5b636e; --faint:#8b929c;
    --pass:#1a9c50; --fail:#d23636; --skip:#9a6b0c;
    --pass-text:#15803d; --fail-text:#b91c1c; --skip-text:#8a5e0a;
    --pass-bg:#e4f5ea; --fail-bg:#fbe8e8; --skip-bg:#f6edd6;
    --bar-pass:#22a35a; --bar-fail:#dc3b3b; --bar-skip:#a7740f; --bar-text:#ffffff;
    --ph-given:#2f74d0; --ph-when:#8350c4; --ph-then:#0c8576;
    --ph-given-ink:#2562c2; --ph-when-ink:#7237bd; --ph-then-ink:#0a7567;
    --v-create:#2563eb; --v-read:#0d9488; --v-edit:#e07a14; --v-delete:#9333ea;
    --accent:#3b62e8;
    --shadow:0 1px 2px rgba(17,24,39,.06), 0 6px 16px rgba(17,24,39,.06);
    --shadow-sm:0 1px 2px rgba(17,24,39,.07);
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300; --cat-7:#9085e9; --cat-8:#e66767;
    --bg:#0d1117; --bg-grad:#0b0f14;
    --surface:#161b22; --surface-2:#1b2230; --inset:#10151d;
    --border:#2a313c; --border-strong:#39414e;
    --ink:#e6edf3; --muted:#9aa4b0; --faint:#6c7682;
    --pass:#3fb950; --fail:#f0524a; --skip:#d4a13a;
    --pass-text:#56d364; --fail-text:#ff7b72; --skip-text:#e3b341;
    --pass-bg:rgba(63,185,80,.15); --fail-bg:rgba(240,82,74,.15); --skip-bg:rgba(212,161,58,.16);
    --bar-pass:#2ea043; --bar-fail:#da3633; --bar-skip:#b9842a; --bar-text:#ffffff;
    --ph-given:#3f82e6; --ph-when:#9a6ae0; --ph-then:#1aa48d;
    --ph-given-ink:#2562c2; --ph-when-ink:#7237bd; --ph-then-ink:#0a7567;
    --v-create:#4f8bff; --v-read:#2dd4bf; --v-edit:#f59e3c; --v-delete:#c07bf0;
    --accent:#5b86ff;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:var(--ink);
    background:var(--surface);
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:var(--mono); }

  /* Shared compact shell: every header block is exactly 56px high. */
  .appbar{padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
  .run-summary{display:flex;align-items:start;gap:6px}
  .run-summary .logo{width:56px;height:56px;min-width:56px;min-height:56px;max-height:56px;display:grid;place-items:center;color:var(--bar-text);background:var(--pass)}
  .run-summary .logo svg{width:23px;height:29px;stroke-width:3.2}
  .run-summary:has([data-run-status="fail"]) .logo{background:var(--fail)}
  .run-summary-items{display:flex;align-items:start;gap:6px;flex:1;min-width:0;flex-wrap:wrap}
  #report-tabs{display:flex;gap:6px;min-width:0}
  .summary-section,.summary-time-box{height:56px;min-height:56px;max-height:56px;border:1px solid transparent;border-radius:0;background:var(--surface-2);padding:6px 12px;color:var(--ink);font:13px/1.4 var(--sans);text-align:left}
  .summary-section{display:grid;grid-template-columns:repeat(3,auto);gap:0 10px;align-content:center;cursor:pointer}
  .summary-section-title{grid-column:1/-1;font-size:14px;font-weight:600}
  .summary-metric,.summary-score{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap;font-size:12px}
  .summary-label{color:var(--muted)}
  .summary-number{font-variant-numeric:tabular-nums;font-weight:500}
  [data-status="pass"] .summary-number{color:var(--pass-text)}
  [data-status="fail"] .summary-number{color:var(--fail-text)}
  [data-status="skip"] .summary-number{color:var(--skip-text)}
  .summary-times{display:flex;gap:6px;margin-left:auto}
  .summary-time-box{display:flex;flex-direction:column;justify-content:center;gap:1px}
  .summary-time-box .summary-number{font-size:13px;white-space:nowrap}
  .generated-toggle{cursor:pointer}
  .summary-section[aria-selected="true"]{background:var(--surface-hover);border-color:var(--border-strong)}
  .summary-section:focus-visible,.generated-toggle:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  main{margin:0;padding:0}
  .card{position:relative;background:var(--surface);border:0;border-top:1px solid var(--border);border-radius:0;margin:0;padding-left:8px;transition:margin-top 160ms cubic-bezier(.2,.8,.2,1)}
  .card-head{display:grid;grid-template-columns:12px 12px minmax(0,1fr) max-content;align-items:center;column-gap:10px;row-gap:0;padding:12px 12px 12px 0;cursor:pointer;min-width:0}
  .card:not(.collapsed){background:var(--surface-2);outline:1px solid var(--border-strong);outline-offset:-1px}
.card:not(.collapsed)+.card,.card+.card:not(.collapsed){margin-top:8px}
  .card:not(.collapsed)+.card.collapsed,.card.collapsed+.card:not(.collapsed){margin-top:8px;border-top-color:transparent}
  .card::before{content:"";position:absolute;top:-1px;left:0;right:0;border-top:1px solid var(--border);pointer-events:none;opacity:0;transition:top 160ms cubic-bezier(.2,.8,.2,1),opacity 160ms ease}
  .card:not(.collapsed)+.card.collapsed::before,.card.collapsed+.card:not(.collapsed)::before{top:-5px;opacity:1}
  @media(prefers-reduced-motion:reduce){.card,.card::before{transition:none}}
  .card.collapsed:hover{background:var(--surface-2)}
  .card-head:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
  .card-head .tw,.step-head .stw{display:grid;place-items:center;color:var(--muted);width:12px;height:12px;line-height:1;flex:none}
  .card.collapsed .card-head .tw{transform:rotate(-90deg)}
  .scenario-status{display:inline-block;width:12px;height:12px;border-radius:4px;corner-shape:squircle;flex:none}
  .step-head>.scenario-status{width:8px;height:8px;border-radius:3px}
  .scenario-status.passed{background:var(--pass)}
  .scenario-status.failed{background:var(--fail)}
  .scenario-status.skipped{background:light-dark(#d3a21e,#e9c478)}
  .scenario-status.not-taken{background:var(--faint)}
  .card-head .name{display:flex;align-items:baseline;gap:6px;flex:1;min-width:0;font-size:14px;font-weight:500}.scenario-title{min-width:0;overflow-wrap:anywhere}.card-head .report-meta{max-width:40%}
  .card-head .dur{flex:none;white-space:nowrap;text-align:right}
  .card-body{padding:0 0 0 20px}
  @media(max-width:650px){
    .appbar{padding:8px 12px}.run-summary,.run-summary-items,#report-tabs{gap:4px}
    .run-summary-items{display:block}.summary-times{margin-top:4px;gap:4px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.3fr)}
    #report-tabs{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
    .summary-section{padding:4px 6px;gap:0 5px;grid-template-columns:repeat(2,auto)}
    .summary-section-title{font-size:13px}.summary-metric,.summary-score{font-size:11px;gap:3px}
    .summary-section .summary-metric:last-child{grid-column:auto}.summary-time-box{padding:5px 8px}
    .summary-time-box{min-width:0}.summary-time-box .summary-label{font-size:11px;overflow-wrap:anywhere}.summary-time-box .summary-number{font-size:12px}.card-body{padding-left:12px}.card-head{column-gap:7px}
  }

  /* one group per scenario class: its [DisplayName], or the class name */
  .group{ margin:18px 0 4px; }
  .group-head{ display:flex; align-items:baseline; gap:10px; padding:2px 2px 4px; cursor:pointer; }
  .group-head .tw{ color:var(--faint); font-size:10px; transition:transform .15s; width:10px; flex:none; }
  .group.collapsed .group-head .tw{ transform:rotate(-90deg); }
  .group-head .gn{ font-size:13px; font-weight:700; color:var(--ink); }
  .group-head .gc{ font:12px var(--mono); color:var(--faint); }
  .group-head .gc .f{ color:var(--bar-fail); font-weight:700; }
  .group-head .gc .k{ color:var(--bar-skip); }
  .group.collapsed .group-body{ display:none; }
  .card.collapsed .card-body{ display:none; }
  .card-head .where{grid-column:3/-1;font-size:11px;line-height:1.2;color:var(--muted);overflow-wrap:anywhere}
  .card.collapsed .card-head .where{display:none}
  .report-meta{display:inline-flex;align-items:baseline;gap:6px;min-width:0;font:12px/1.6 var(--sans);color:var(--muted)}
  .report-meta-dot{flex:none}.leading-ellipsis{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}.leading-ellipsis>span{direction:ltr;unicode-bidi:isolate}
  .dur{ font:13px/1 var(--mono); color:var(--muted); }

  .pill{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    padding:3px 8px; border-radius:0; white-space:nowrap;
  }
  .pill .pd{ width:7px; height:7px; border-radius:50%; }
  .pill.passed{ color:var(--pass-text); background:var(--pass-bg); } .pill.passed .pd{ background:var(--pass); }
  .pill.failed{ color:var(--fail-text); background:var(--fail-bg); } .pill.failed .pd{ background:var(--fail); }
  .pill.skipped{ color:var(--skip-text); background:var(--skip-bg); } .pill.skipped .pd{ background:var(--skip); }
  /* a branch arm that was not chosen: a decision, not a problem, so neutral rather than amber */
  .pill.not-taken{ color:var(--muted); background:var(--inset); } .pill.not-taken .pd{ background:var(--faint); }
  .step-entry.status-not-taken .dn{ color:var(--muted); }
  .step-entry .dn s{text-decoration-thickness:1px}
  .step-entry .dn s .message-resource{text-decoration-line:line-through;text-decoration-style:solid;text-decoration-color:currentColor;text-decoration-thickness:1px}

  /* ---------- DRILL PANEL (scenario-level: every step in run order) ---------- */
  .drill-host{ margin-top:4px; }
  .drill{ display:none; margin-top:10px; }
  .drill.open{ display:block; }
  .scenario-drill{position:relative}
  .step-head>.scenario-status{grid-column:2;grid-row:1;justify-self:start}
  .step-head>.dependency-node{outline-offset:3px}
  .step-head>.dependency-node:focus-visible{outline:1px solid var(--muted)}
  .step-entry.dependency-related:not(.status-failed){background:color-mix(in srgb,var(--surface-hover) 55%,transparent)}
  .step-entry.dependency-related>.step-head>.scenario-status{outline:1px solid var(--muted);outline-offset:2px}
  .step-list{ display:flex; flex-direction:column; border-top:1px solid var(--border); }
  .step-entry{
    display:grid;grid-template-columns:12px var(--dependency-gutter,8px) minmax(0,1fr) max-content;column-gap:9px;
    border-bottom:1px solid var(--border); padding:10px 12px 12px 4px; scroll-margin-top:18px;
    transition:box-shadow .15s ease, background .15s ease;
  }
  .step-entry.status-failed{ background:color-mix(in srgb, var(--fail-bg) 55%, transparent); }
  .step-entry.focus{ box-shadow:0 0 0 2px var(--accent); }
  .step-head{display:grid;grid-template-columns:subgrid;grid-column:1/-1;align-items:center;column-gap:9px;min-width:0}
  .step-head .dn{font-weight:500;font-size:14px;flex:1;min-width:0;overflow-wrap:anywhere}
  .step-lifecycle .dn{color:var(--muted);font-style:italic}
  .step-lifecycle.status-passed:not(.open){padding-top:2px;padding-bottom:3px}
  .step-lifecycle.status-passed:not(.open) .step-head>.scenario-status,
  .step-lifecycle.status-passed:not(.open) .step-head>.dm{visibility:hidden}
  .step-lifecycle.status-passed:not(.open) .dn{font-size:12px}
  .step-lifecycle.status-passed .step-head{cursor:pointer}
  .phase-given{color:var(--ph-given)}.phase-when{color:var(--ph-when)}.phase-then{color:var(--ph-then)}
  .phase-given,.phase-when,.phase-then{text-decoration:none}
  .step-head .dm{display:flex;align-items:center;justify-content:flex-end;gap:8px;font:12px/1.4 var(--sans);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
  .step-offset{color:var(--faint)}
  .resource-mention{display:inline;white-space:normal}
  .message-resource{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;text-decoration-line:underline;text-decoration-style:solid;text-decoration-color:color-mix(in srgb,var(--resource-color,var(--muted)) 50%,var(--muted));text-underline-offset:2px;text-decoration-thickness:1px}
  .message-resource:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .message-resource.hl{background:var(--ink);color:var(--surface)}
  .resource-hover{position:fixed;inset:auto;margin:0;z-index:100;display:block;width:fit-content;min-width:min(220px,calc(100vw - 24px));max-width:min(400px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;padding:10px;background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);box-shadow:0 6px 24px #0003;font:12px/1.4 var(--sans);text-align:left;white-space:normal}
  .resource-hover-title{display:flex;align-items:baseline;gap:6px;white-space:nowrap;font-weight:600;font-size:13px}
  .resource-hover-type{max-width:50%;flex:none;overflow:hidden;text-overflow:ellipsis}
  .resource-hover-id{min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font:12px var(--mono)}
  .resource-hover pre{max-height:200px;overflow:auto;margin:8px 0;padding:8px;background:var(--surface-2);font:12px/1.45 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
  .resource-hover-event{display:block;margin-top:6px;color:var(--muted)}
  .resource-hover-empty,.resource-hover-truncated{display:block;margin:8px 0;color:var(--muted)}
  .resource-hover-actions{display:flex;gap:6px;margin-top:8px}
  .resource-hover-actions button{border:1px solid var(--border-strong);background:var(--surface-2);color:var(--ink);padding:4px 8px;font:inherit;cursor:pointer}
  .resource-hover-actions button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}.resource-hover-actions button:disabled{opacity:.5;cursor:default}
  .resource-activity-hit{background:var(--surface-hover)}
  .step-notes{grid-column:3/-1;margin:1px 0 0;min-width:0}
  .step-note{margin:0;color:var(--muted);font-size:12px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}
  .step-head .stw{transform:rotate(-90deg)}
  .step-entry.open .step-head .stw{transform:none}
  .step-entry.has-body .step-head{cursor:pointer}
  .step-expander,.lifecycle-toggle{border:0;background:none;padding:3px 0;color:var(--muted);font:inherit;cursor:pointer;flex:none}
  .step-expander:focus-visible,.lifecycle-toggle:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .step-body{grid-column:2/-1;display:none;margin:8px 0 0;min-width:0}
  .step-entry.open .step-body{display:block}
  .step-entry.step-animating>.step-body{display:block;overflow:hidden}
  .sec{margin-top:10px}.sec h4{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--muted)}
  .logs{margin:7px 0 0;padding:0;list-style:none}
  .logs li{font:12px/1.6 var(--mono);color:var(--ink);margin:3px 0;white-space:pre-wrap;overflow-wrap:anywhere}
  .step-logs,.step-trace{margin-top:10px}.step-logs>summary,.step-trace>summary{font-size:12px;color:var(--muted);cursor:pointer}
  .detail-count{font-variant-numeric:tabular-nums;margin-left:6px}
  @media(max-width:650px){.step-entry{column-gap:6px}.step-head{column-gap:6px;row-gap:1px}.step-head .dm{grid-column:3/-1;justify-content:flex-start}}
  .att{ margin:4px 0; }
  .att > summary{ cursor:pointer; font-size:12px; color:var(--ink); }
  .att > summary .an{ font-weight:600; }
  .att > summary .asz{ font:11.5px var(--mono); color:var(--faint); margin-left:6px; }
  .att[open] > summary{ margin-bottom:4px; }
  /* an attachment is data, not a failure: neutral inset, never the exception red */
  .att-body{
    margin:0; padding:11px 13px; border-radius:0; overflow:auto;
    background:var(--inset); border:1px solid var(--border);
    color:var(--ink); font-family:var(--mono); font-size:12px; line-height:1.55; white-space:pre;
  }
  .eff{ display:flex; flex-direction:column; gap:5px; }
  .eff .e{ display:flex; align-items:center; gap:9px; font-size:12.5px; flex-wrap:wrap; }
  .eff .vd{ width:9px; height:9px; border-radius:50%; flex:none; }
  .eff .vb{ font-weight:600; width:50px; text-transform:capitalize; }
  .eff .id{ font-family:var(--mono); }
  .eff .of{ font-family:var(--mono); color:var(--faint); }
  .eff .da{ color:var(--muted); font-size:12px; }
  .exc{
    margin:0; padding:11px 13px; border-radius:0; overflow:auto;
    background:var(--fail-bg); border:1px solid color-mix(in srgb, var(--fail) 30%, transparent);
    color:var(--ink); font-family:var(--mono); font-size:12px; line-height:1.55; white-space:pre;
  }
  .skipnote{
    display:flex; align-items:center; gap:9px; padding:10px 13px; border-radius:0;
    background:var(--skip-bg); border:1px solid color-mix(in srgb, var(--skip) 30%, transparent);
    color:var(--skip-text); font-size:12.5px;
  }
  .skipnote::before{ content:"\26A0"; font-size:14px; }
  .hint{ color:var(--faint); font-size:11.5px; margin:2px 0 10px; }

<body>
  <div class="appbar">
    <div class="run-summary">
      <div class="logo" role="img" aria-label="Raun run report" title="Raun run report">
        <svg viewBox="0 0 20 24" width="12" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 2v20M5 2l10 5.5L5 13l10 9"/>
        </svg>
      </div>
      <div id="run-summary"></div>
    </div>
  </div>
  <main id="report"></main>

  <script id="model" type="application/json">/*__RAUN_REPORT_JSON__*/</script>

  <script>
    "use strict";
    // explicit theme override for deterministic screenshots
    (function(){
      const p = new URLSearchParams(location.search).get("theme");
      if (p === "dark" || p === "light") document.documentElement.dataset.theme = p;
    })();

    const model = JSON.parse(document.getElementById("model").textContent);

    const esc = (x) => String(x == null ? "" : x).replaceAll("&", "&amp;").replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
    const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };

    // milliseconds to one decimal: the timings are measured, not exact, and more digits are noise
    function fmtMs(ms){ return Number(ms).toFixed(1) + " ms"; }
    function fmtDur(ms){
      if (ms >= 1000) return (ms / 1000).toFixed(2) + " s";
      return fmtMs(ms);
    }
    function fmtGen(iso){
      // 2026-06-19T21:42:11Z -> 2026-06-19 21:42:11 UTC
      return iso.replace("T", " ").replace("Z", " UTC").replace(/(\.\d+)/, "");
    }

    // ---- nice auto-scaled axis -------------------------------------------
    function niceAxis(maxMs){
      maxMs = Math.max(maxMs, 1);
      const raw = maxMs / 6;
      const mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const n = raw / mag;
      const step = (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
      const axisMax = Math.ceil(maxMs / step) * step;
      return { step, axisMax };
    }
    function fmtTick(ms, axisMax){
      if (ms === 0) return "0";
      if (axisMax >= 1000){ const s = ms / 1000; return (s % 1 === 0 ? s.toFixed(0) : s.toFixed(1)) + "s"; }
      return ms + "";
    }

    // ---- compact run summary ---------------------------------------------
    document.getElementById("run-summary").replaceWith(buildRunHeader(model));

    // ---- resource colours: the eight categorical slots (--cat-1..8, stepped per theme in CSS) ----
    // Type and key labels use separate categorical slots; matrix identities get their own palette.
    const CAT_SLOTS = 8;
    const KEY_SLOTS = 7; // keys hash into slots 1..7 only
    const catVar = (i) => "var(--cat-" + ((i % CAT_SLOTS) + 1) + ")";
    const typeSlotMap = new Map();
    for (const sc of model.scenarios)
      for (const r of sc.resources)
        if (!typeSlotMap.has(r.type)) typeSlotMap.set(r.type, typeSlotMap.size);
    const hashOf = (k) => { let h = 0; for (let i = 0; i < (k || "").length; i++) h = (h * 31 + k.charCodeAt(i)) >>> 0; return h; };
    function typeSlot(t){
      if (!typeSlotMap.has(t)) typeSlotMap.set(t, typeSlotMap.size);
      return typeSlotMap.get(t) % CAT_SLOTS;
    }
    function typeColor(t){ return catVar(typeSlot(t)); }
    // ---- scenarios --------------------------------------------------------
    // '[resource] {Verb} {Type}:{key}' log lines, optionally timer-stamped ('+0.320s ')
    const RESOURCE_LINE = /^(\+[\d.]+s )?\[resource\] (\w+) ([^:\s]+):(.*)$/;
    const report = document.getElementById("report");
    let reportApp = null;
    const openers = [];
    let messageInspectorSequence = 0;
    let stepDetailSequence = 0;
    // Remember scenario expansion while the user switches views. Failed scenarios start open.
    const expandedFor = new Map();
    const isExpanded = (sc) => expandedFor.has(sc.scenarioId) ? expandedFor.get(sc.scenarioId) : sc.status === "failed";
    function setExpanded(sc, on){
      expandedFor.set(sc.scenarioId, on);
      const card = report.querySelector('.card[data-scenario="' + CSS.escape(sc.scenarioId) + '"]');
      if (card) transitionScenario(card,on);
      return card;
    }

    // "Ns.Class.Method" -> "Method": the row shows the short name, the expanded card the full one
    const shortName = (cls) => !cls ? "" : cls.slice(cls.lastIndexOf(".") + 1);

    // Group consecutive scenarios by class without changing their registration order.
    // The label is the class's [DisplayName] when it has one, else the class name.
    function groupByClass(scenarios){
      const groups = [];
      for (const sc of scenarios){
        const type = sc.methodName.slice(0, sc.methodName.lastIndexOf("."));
        let group = groups[groups.length - 1];
        if (!group || group.type !== type){
          group = { type, label: sc.classDisplayName || shortName(type), scenarios: [] };
          groups.push(group);
        }
        group.scenarios.push(sc);
      }
      return groups;
    }

    const collapsedGroups = new Set();
    function buildGroup(group){
      const sec = el("section", "group" + (collapsedGroups.has(group.type) ? " collapsed" : ""));
      const failed = group.scenarios.filter((sc) => sc.status === "failed").length;
      const skipped = group.scenarios.filter((sc) => sc.status === "skipped").length;
      const head = el("div", "group-head");
      head.tabIndex = 0;
      head.setAttribute("role", "button");
      head.title = group.type;
      head.innerHTML =
        '<span class="tw" aria-hidden="true">▼</span>' +
        '<span class="gn">' + esc(group.label) + "</span>" +
        '<span class="gc">' + group.scenarios.length + (group.scenarios.length === 1 ? " scenario" : " scenarios") +
          (failed ? ' · <span class="f">' + failed + " failed</span>" : "") +
          (skipped ? ' · <span class="k">' + skipped + " skipped</span>" : "") + "</span>";
      const toggle = () => {
        const on = !sec.classList.toggle("collapsed");
        if (on) collapsedGroups.delete(group.type); else collapsedGroups.add(group.type);
        head.setAttribute("aria-expanded", String(on));
      };
      head.setAttribute("aria-expanded", String(!sec.classList.contains("collapsed")));
      head.addEventListener("click", event=>{if(!event.target.closest("a"))toggle();});
      head.addEventListener("keydown", (ev) => {
        if (ev.target.closest("a") || (ev.key !== "Enter" && ev.key !== " ")) return;
        toggle(); ev.preventDefault();
      });
      const body = el("div", "group-body");
      for (const sc of group.scenarios) body.appendChild(renderScenario(sc));
      sec.append(head, body);
      return sec;
    }


    function stepNotesHtml(notes,messages,sc){
      const values=messages && messages.length ? messages : notes;
      if (!values || !values.length) return "";
      return '<div class="step-notes">' + values.map(note=>'<p class="step-note">' +
        (typeof note === "string" ? esc(note) : messageHtml(note,sc)) + '</p>').join("") + '</div>';
    }

    const COVERAGE_KINDS = ["Argument checks", "Error handling", "Null propagation", "Logging", "Logic"];
    function buildRunHeader(report){
      const row=el("div","run-summary-items"), sum=report.summary, tabs=el("nav");
      row.setAttribute("data-run-status",sum.failed > 0 ? "fail" : "pass");
      tabs.id="report-tabs";tabs.setAttribute("aria-label","Report views");row.appendChild(tabs);
      const metric=(label,value,kind="",parent=row)=>{
        const item=el("span","summary-metric");
        if(kind)item.setAttribute("data-status",kind);
        item.appendChild(coverageText("span","summary-label",label));
        item.appendChild(coverageText("span","summary-number",String(value)));
        parent.appendChild(item);return item;
      };
      const section=(key,label)=>{
        const button=el("button","report-tab summary-section");button.type="button";button.dataset.view=key;button.setAttribute("aria-label",label);
        button.appendChild(coverageText("span","summary-section-title",label));tabs.appendChild(button);return button;
      };
      const tests=section("tests","Scenarios");
      tests.setAttribute("aria-description",sum.passed+" passed, "+sum.failed+" failed, "+sum.skipped+" skipped");
      metric("Passed",sum.passed,"pass",tests);metric("Failed",sum.failed,"fail",tests);metric("Skipped",sum.skipped,"skip",tests);
      if(report.coverage){
        const coverage=section("coverage","Coverage"), available=report.coverage.status==="available";
        const counts=available ? (report.coverage.categories || []).find(category=>category.category===4)?.counts || {} : {};
        const total=counts.decisionMeasurable || 0, complete=counts.complete || 0, paths=available ? report.coverage.branchPaths : null;
        const score=el("span","summary-score");
        score.title=total ? complete+" of "+total+" measurable logic decisions tested on every path. Expressions and argument checks are excluded."
          : "No measurable logic decisions. Coverage may be unavailable or still pending.";
        if(counts.unknown)score.title+=" "+counts.unknown+" unresolved branches excluded.";
        const logical=total ? Math.round(100*complete/total)+"%" : "—", overall=paths?.total ? Math.round(100*paths.covered/paths.total)+"%" : "—";
        score.appendChild(coverageText("span","summary-label","Logical"));score.appendChild(coverageText("span","summary-number",logical));

        coverage.appendChild(score);
        metric("Total",overall,"",coverage).title=paths?.total ? paths.covered+" of "+paths.total+" collector branch paths taken at least once."
          : "Collector branch-path coverage is unavailable or still pending.";
        coverage.setAttribute("aria-description","Logical "+logical+", total "+overall);
      }
      const times=el("div","summary-times");row.appendChild(times);
      metric("Wall clock",fmtDur(sum.totalMs),"",times).classList.add("summary-time-box");
      const generated=el("button","summary-time-box generated-toggle");generated.type="button";generated.setAttribute("data-generated","true");
      const label=coverageText("span","summary-label","Generated · UTC"), timestamp=el("time","summary-number");
      timestamp.setAttribute("datetime",report.generatedAtUtc);generated.appendChild(label);generated.appendChild(timestamp);times.appendChild(generated);
      let local=false;
      const updateGenerated=()=>{
        const zone=local ? Intl.DateTimeFormat().resolvedOptions().timeZone : "UTC";
        const date=new Date(report.generatedAtUtc);
        const parts=Number.isNaN(date.getTime()) ? null : new Intl.DateTimeFormat("en-GB",{timeZone:zone,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(date);
        const value=type=>parts.find(part=>part.type===type).value;
        timestamp.textContent=parts ? value("year")+"-"+value("month")+"-"+value("day")+" "+value("hour")+":"+value("minute")+":"+value("second") : "Unavailable";
        label.textContent="Generated · "+zone;generated.setAttribute("aria-pressed",String(local));
        generated.title=local ? "Show generated time in UTC" : "Show generated time in your local timezone";
      };
      generated.addEventListener("click",()=>{local=!local;updateGenerated();});updateGenerated();
      return row;
    }

    function coverageText(tag, cls, text){
      const node = el(tag, cls);
      node.textContent = text;
      return node;
    }
    function coverageCounts(item, key){
      const category = (item.categories || []).find(value => value.category === key);
      return category ? category.counts : {};
    }
    function coverageRank(item, key){
      const c = coverageCounts(item, key);
      const families = {
        decisions: {total:c.decisionMeasurable || 0, covered:c.complete || 0},
        guards: {total:c.exerciseMeasurable || 0, covered:c.exercised || 0},
        expressions: {total:(c.reached || 0)+(c.partial || 0)+(c.expressionNotReached || 0), covered:c.reached || 0},
        filters: {total:(c.evaluated || 0)+(c.filterPartial || 0)+(c.filterNotReached || 0), covered:c.evaluated || 0}
      };
      const order = key === 0 || key === 1 ? ["guards", "decisions", "expressions"]
        : key === 2 ? ["expressions", "decisions", "guards"] : ["decisions", "guards", "expressions"];
      order.push("filters");
      for (let priority=0; priority<order.length; priority++){
        const family = order[priority], evidence = families[family];
        if (evidence.total) return {family, priority, fraction:evidence.covered/evidence.total,
          missing:evidence.total-evidence.covered, unknown:c.unknown || 0};
      }
      return {family:c.inventory ? "unverified" : "other", priority:c.inventory ? 4 : 5,
        fraction:null, missing:0, unknown:c.unknown || 0};
    }
    function coverageCompare(a,b,key){
      const x=coverageRank(a,key), y=coverageRank(b,key);
      const label = value => (value.assembly || "") + "\0" + (value.name || value.signature || "");
      const an=label(a), bn=label(b);
      return x.priority-y.priority || (x.fraction ?? 0)-(y.fraction ?? 0) || y.missing-x.missing
        || y.unknown-x.unknown || (an<bn ? -1 : an>bn ? 1 : 0);
    }
    function coverageSegments(counts){
      const c=counts || {};
      return [
        {key:"covered",count:(c.exercised || 0)+(c.complete || 0),label:"exercised / complete",family:"exact"},
        {key:"incomplete",count:c.incomplete || 0,label:"incomplete",family:"exact"},
        {key:"missed",count:Math.max(0,(c.notReached || 0)-(c.expressionNotReached || 0)-(c.filterNotReached || 0)),label:"not reached",family:"exact"},
        {key:"reached",count:c.reached || 0,label:"expression reached",family:"coarse"},
        {key:"partial",count:c.partial || 0,label:"expression partial",family:"coarse"},
        {key:"expression-missed",count:c.expressionNotReached || 0,label:"expression not reached",family:"coarse"},
        {key:"evaluated",count:c.evaluated || 0,label:"filter evaluated",family:"filters"},
        {key:"filter-partial",count:c.filterPartial || 0,label:"filter partly evaluated",family:"filters"},
        {key:"filter-missed",count:c.filterNotReached || 0,label:"filter not evaluated",family:"filters"},
        {key:"unknown",count:c.unknown || 0,label:"unknown",family:"unverified"},
        {key:"helper",count:c.unmeasurable || 0,label:"unmeasurable helper",family:"unverified"}
      ].filter(segment=>segment.count);
    }
    function coverageBar(segments){
      const bar=el("div","coverage-bar"), total=segments.reduce((sum,segment)=>sum+segment.count,0);
      const description=segments.map(segment=>segment.count+" "+segment.label).join(" · ");
      bar.setAttribute("role","img"); bar.setAttribute("aria-label",description); bar.title=description;
      for (const segment of segments){
        const part=el("span","coverage-"+segment.key);
        part.style.width=(segment.count/total*100)+"%"; bar.appendChild(part);
      }
      return bar;
    }
    function coverageLabels(counts,key){
      const c=counts || {}, labels=[];
      const number=(count,singular,plural)=>count+" "+(count===1 ? singular : plural);
      if (c.decisionMeasurable) labels.push({family:"exact",text:(c.complete || 0)+" of "+c.decisionMeasurable+" decisions fully tested",
        explanation:"Every observable arm of a decision ran. A partly tested decision still has an untested path."});

      const byId=new Map(sc.steps.map(step=>[step.stepId,step]));
      const finalArms=new Map(branches.map(branch=>[branch.condition,branch]));
      for(const branch of branches){
        branch.section.classList.toggle("flow-arm-continues",finalArms.get(branch.condition)!==branch);
        const members=Array.from(branch.content.querySelectorAll('.step-entry'),row=>byId.get(row.dataset.step));
        const notTaken=members.length>0 && members.every(step=>step.status==='not-taken' || step.status==='skipped' && step.skipReason?.startsWith('not taken:'));
        branch.content.hidden=notTaken;branch.button.setAttribute('aria-expanded',String(!notTaken));
        if(notTaken)branch.button.appendChild(coverageText('span','flow-not-taken','not taken'));
      }
      const prerequisites=step=>{
        const result=[],seen=new Set();
        const visit=index=>{
          if(seen.has(index))return;seen.add(index);
          const predecessor=byIndex.get(index);if(!predecessor)return;
          if(predecessor.isValueMerge && predecessor.status!=='failed'){
            for(const source of predecessor.dependsOn || []){
              const candidate=byIndex.get(source);
              if(candidate && candidate.status!=='not-taken' && !(candidate.status==='skipped' && candidate.skipReason?.startsWith('not taken:')))visit(source);
            }
          }else result.push(predecessor);
        };
        for(const index of step.dependsOn || [])visit(index);
        return result;
      };
      const highlight=step=>{
        const related=new Set([step.index,...prerequisites(step).map(predecessor=>predecessor.index)]);
        for(const candidate of sc.steps)rows.get(candidate.stepId).classList.toggle('dependency-related',related.has(candidate.index));
      };
      const clear=()=>{for(const row of rows.values())row.classList.remove('dependency-related');};
      for(const step of sc.steps){
        const row=rows.get(step.stepId),head=row.querySelector('.step-head'),timing=head.querySelector('.dm');
        head.querySelector('.step-offset')?.remove();
        const axis=el('button','step-gantt'),track=el('div','gantt-track');axis.type='button';axis.setAttribute('aria-expanded','false');track.setAttribute('aria-hidden','true');
        const timed=['passed','failed'].includes(step.status) && Number.isFinite(step.offsetMs) && Number.isFinite(step.durationMs);
        const start=Math.max(0,step.offsetMs),duration=Math.max(0,step.durationMs);
        axis.title=timed ? '+'+fmtDur(start)+' to +'+fmtDur(start+duration)+' / '+fmtDur(duration) : step.status+' / did not run';
        axis.setAttribute('aria-label','Timing and prerequisites for '+step.displayName+': '+axis.title);
        if(timed && showTiming){
          const bar=el('span','gantt-bar');bar.setAttribute('aria-hidden','true');
          const left='min('+(100*start/scale)+'%,calc(100% - 2px))';
          bar.style.left=left;bar.style.width=(100*duration/scale)+'%';
          bar.style.maxWidth='calc(100% - '+left+')';track.appendChild(bar);
        }
        axis.appendChild(timing.querySelector('.step-duration'));timing.prepend(axis);head.appendChild(track);
        const panel=el('div','step-prerequisites');panel.hidden=true;panel.id='step-prerequisites-'+(++stepDetailSequence);
        axis.setAttribute('aria-controls',panel.id);
        panel.appendChild(coverageText('span','',step.dependsOn?.length ? 'After:' : 'No prerequisites'));
        for(const predecessor of prerequisites(step)){
          const index=predecessor.index;
          const bindingGuard=predecessor.isBranchBinding ? predecessor.guards?.at(-1) : null;
          const label=bindingGuard ? readableBranch(byIndex.get(bindingGuard.conditionIndex),bindingGuard.arm)+' (matched value)' : predecessor.displayName;
          const link=coverageText('button','predecessor-link',label);link.type='button';link.dataset.from=String(index);link.dataset.to=String(step.index);
          const kinds=step.dependencies?.filter(edge=>edge.index===index).map(edge=>edge.kind) || ['dependency'];
          link.title=kinds.join(', ');
          link.addEventListener('click',()=>{
            const target=rows.get(predecessor.stepId);target.hidden=false;
            for(const branch of branches)if(branch.content.contains(target)){branch.content.hidden=false;branch.button.setAttribute('aria-expanded','true');}
            if(predecessor.isLifecycle)transitionStep(target,true);
            const control=target.querySelector('.step-gantt');control.focus({preventScroll:true});target.scrollIntoView({block:'nearest',behavior:'instant'});highlight(predecessor);
          });panel.appendChild(link);
        }
        row.appendChild(panel);
        axis.addEventListener('click',()=>{panel.hidden=!panel.hidden;axis.setAttribute('aria-expanded',String(!panel.hidden));if(panel.hidden)clear();else highlight(step);});
        axis.addEventListener('pointerenter',()=>highlight(step));axis.addEventListener('pointerleave',clear);
        axis.addEventListener('focus',()=>highlight(step));axis.addEventListener('blur',clear);
      }
      drill.addEventListener('keydown',event=>{if(event.key==='Escape'){const owner=event.target.closest?.('.step-prerequisites')?.parentElement;owner?.querySelector('.step-gantt').focus({preventScroll:true});for(const row of rows.values()){row.querySelector('.step-prerequisites').hidden=true;row.querySelector('.step-gantt').setAttribute('aria-expanded','false');}clear();}});
    }
    // every step of a scenario, in registration order, with local progressive disclosure
    function buildScenarioDrill(sc){
      const p=el("div","drill scenario-drill");p.dataset.focus="";
      let h='<div class="step-list">';
      for(const s of sc.steps){
        let b="";
        if(s.skipReason)b+='<p class="skipnote">'+esc(s.skipReason)+'</p>';
        if(s.exception)b+='<div class="sec"><h4>Exception</h4><pre class="exc">'+esc(s.exception)+'</pre></div>';
        if((s.logMessages && s.logMessages.length) || (s.logs && s.logs.length)){
          const logs=s.logMessages?.length ? s.logMessages.map(l=>logMessageHtml(l,sc)) : s.logs.map(logHtml);
          b+='<div class="step-logs"><ul class="logs">'+logs.map(line=>'<li>'+line+'</li>').join('')+'</ul></div>';
        }
        if(s.traceId)b+='<details class="step-trace"><summary>Trace</summary><pre class="att-body">'+esc(s.traceId)+(s.spanId ? '\nSpan '+esc(s.spanId) : '')+'</pre></details>';
        if(s.attachments?.length)b+='<div class="sec">'+s.attachments.map(a=>'<details class="att"><summary><span class="an">'+esc(a.name)+'</span><span class="asz">'+attSize(a.value)+'</span></summary><pre class="att-body">'+esc(a.value)+'</pre></details>').join('')+'</div>';
        const skipped=s.status==='skipped' || s.status==='not-taken';
        const strike=text=>skipped ? '<s>'+text+'</s>' : text;
        const phase=String(s.phase || '').toLowerCase();
        const status=s.status==='not-taken' || s.status==='skipped' && s.skipReason?.startsWith('not taken:') ? 'not-taken' : ['passed','failed','skipped'].includes(s.status) ? s.status : 'skipped';
        const cls='step-entry status-'+s.status+' ph-'+phase+(s.isLifecycle ? ' step-lifecycle' : '')+(b ? ' has-body' : '')+(b && s.status==='failed' ? ' open' : '');
        const bodyId=b ? 'step-details-'+(++stepDetailSequence) : '';
        const lifecycleToggle=s.isLifecycle && s.status==='passed';
        const control=b ? 'step-expander' : 'lifecycle-toggle';
        const controlLabel=b ? 'Toggle details for '+s.displayName : 'Toggle metadata for '+s.displayName;
        h+='<div class="'+cls+'" data-step="'+esc(s.stepId)+'"><div class="step-head">'+
          (b || lifecycleToggle ? '<button type="button" class="'+control+'" aria-label="'+esc(controlLabel)+'" aria-expanded="'+String(s.status==='failed')+'"'+(bodyId ? ' aria-controls="'+bodyId+'"' : '')+'><span class="stw" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg></span></button>' : '<span class="stw" aria-hidden="true"></span>')+
          '<span class="scenario-status '+status+'" role="img" aria-label="'+esc(s.status)+'"></span>'+
          '<span class="dn">'+strike(stepTitleHtml(s,sc))+'</span><span class="dm">'+(Number.isFinite(s.offsetMs) ? '<span class="step-offset" title="Time from scenario start">+'+fmtDur(s.offsetMs)+'</span>' : '')+'<span class="step-duration" title="Step duration">'+fmtDur(s.durationMs)+'</span></span></div>'+stepNotesHtml(s.notes,s.noteMessages,sc)+
          (b ? '<div class="step-body" id="'+bodyId+'">'+b+'</div>' : '')+'</div>';
      }
      p.innerHTML=h+'</div>';bindResourceMessages(p,sc);
      p.addEventListener("click",ev=>{
        if(!ev.target.closest || ev.target.closest(".res-chip,.resource-mention,details"))return;
        const head=ev.target.closest(".step-entry.has-body > .step-head,.step-entry.step-lifecycle.status-passed > .step-head");if(!head)return;
        const control=ev.target.closest("button,a[href],input,select,textarea,summary");
        if(control && !control.classList.contains("step-expander") && !control.classList.contains("lifecycle-toggle"))return;
        transitionStep(head.parentElement,!head.parentElement.classList.contains("open"));
      });
      return p;
    }
  </script>
