name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # MinVer derives the version from the nearest v* tag, so it needs the full history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      # --locked-mode fails the build when a packages.lock.json does not match the project's
      # references, so a dependency can never change without the change being in the diff.
      - name: Restore (locked)
        run: dotnet restore Raun.slnx --locked-mode

      - name: Build
        run: dotnet build Raun.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test Raun.slnx -c Release --no-build

      - name: Pack (verifies the packages assemble on every push)
        run: |
          dotnet pack src/Raun/Raun.csproj -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true
          dotnet pack src/Raun.Mtp/Raun.Mtp.csproj -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true
          dotnet pack src/Raun.Aspire/Raun.Aspire.csproj -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages
          path: artifacts/*.nupkg

      # Every push to main publishes its preview build (0.x.y-preview.0.N) to the repository's
      # GitHub Packages feed, so the current head is always consumable. Tags publish real versions
      # through release.yml. Symbols are embedded in the packaged assemblies.
      - name: Publish preview to GitHub Packages
        if: github.event_name == 'push'
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
