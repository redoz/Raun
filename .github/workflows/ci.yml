name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # MinVer derives the version from the nearest v* tag, so it needs the full history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      # --locked-mode fails the build when a packages.lock.json does not match the project's
      # references, so a dependency can never change without the change being in the diff.
      - name: Restore (locked)
        run: dotnet restore Raun.slnx --locked-mode

      - name: Build
        run: dotnet build Raun.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test Raun.slnx -c Release --no-build

      - name: Report interaction tests
        run: node --test test/Raun.Test/Reporting/message-view.test.cjs test/Raun.Test/Reporting/coverage-view.test.cjs

      - name: Install report browser test tools
        working-directory: test/Browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Resource matrix browser tests
        run: |
          dotnet run --project samples/AppointmentTests/AppointmentTests.csproj -c Release --no-build -- --report-html --results-directory "$PWD/artifacts/matrix-sample"
          node test/Browser/resource-matrix.cjs "$PWD/artifacts/matrix-sample/raun-report.html"
          node test/Browser/scenario-flow.cjs "$PWD/artifacts/matrix-sample/raun-report.html"
          node test/Browser/coverage-view.cjs "$PWD/artifacts/matrix-sample/raun-report.html"

      - name: Pack (verifies the packages assemble on every push)
        run: |
          dotnet pack src/Raun/Raun.csproj -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true
          dotnet pack src/Raun.Coverage/Raun.Coverage.csproj -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true
          dotnet pack src/Raun.Mtp/Raun.Mtp.csproj -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true
          dotnet pack src/Raun.Aspire/Raun.Aspire.csproj -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true
          # A non-packable project exits successfully without writing a package.
          # Catch that before publishing any part of a release.
          for package in Raun Raun.Coverage Raun.Mtp Raun.Aspire; do
            if ! compgen -G "artifacts/$package.[0-9]*.nupkg" > /dev/null; then
              echo "Missing package: $package" >&2
              exit 1
            fi
          done

      - name: Test package consumption
        run: |
          dotnet restore test/Raun.PackageTests/Raun.PackageTests.csproj --locked-mode
          dotnet build test/Raun.PackageTests/Raun.PackageTests.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true
          dotnet run --project test/Raun.PackageTests/Raun.PackageTests.csproj -c Release --no-build -- --report-html --results-directory "$PWD/artifacts/package-consumption"

      - name: Upload package consumption report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-consumption-report
          path: artifacts/package-consumption/
          if-no-files-found: ignore

      - name: Upload standalone package report
        id: package-report-html
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifacts/package-consumption/raun-report.html
          archive: false
          if-no-files-found: ignore

      - name: Link package report in run summary
        if: always() && steps.package-report-html.outputs.artifact-url != ''
        env:
          REPORT_URL: ${{ steps.package-report-html.outputs.artifact-url }}
        run: printf '[Package consumption report](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/*.nupkg

      # Every push to main publishes its preview build (0.x.y-preview.0.N) to the repository's
      # GitHub Packages feed, so the current head is always consumable. Tags publish real versions
      # through release.yml. Symbols are embedded in the packaged assemblies.
      - name: Publish preview to GitHub Packages
        if: github.event_name == 'push'
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
