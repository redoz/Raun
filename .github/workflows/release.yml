name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release {0} from main{1}', inputs.bump, inputs.dry_run && ' (dry run)' || '') || format('Release {0}', github.ref_name) }}

# Two ways to release, both publishing that exact version. MinVer reads the tag, so the version is
# never typed anywhere else. See docs/RELEASING.md.
#   - Actions > Release > Run workflow (from main): pick a bump; the next tag is computed from the
#     existing ones, and is pushed only after every test passes.
#   - Push a tag like v0.1.0 (or v0.2.0-beta.1) yourself.
#
# Tags publish to nuget.org; main-branch previews remain on GitHub Packages via ci.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Version bump. prerelease: 0.3.0-beta.33 -> 0.3.0-beta.34. patch / minor / major: a stable
          release (finalizes a pre-release line: 0.3.0-beta.33 -> 0.3.0). prepatch / preminor /
          premajor: start the next line at beta.1.
        type: choice
        options: [prerelease, patch, minor, major, prepatch, preminor, premajor]
        default: prerelease
      preid:
        description: Pre-release label, e.g. rc (blank keeps the current one, else beta)
        type: string
        default: ''
      dry_run:
        description: Only compute and show the version; tag and publish nothing
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Release only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release from main, not $GITHUB_REF."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute the next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 .github/scripts/test_next_version.py
          tag="$(git tag -l 'v*' | python3 .github/scripts/next_version.py "$BUMP" "$PREID")"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi
          # RS2007 rejects a pre-release suffix in a release header, so only a stable release
          # moves rules to AnalyzerReleases.Shipped.md (docs/RELEASING.md, checklist step 2).
          if [[ "$tag" != *-* ]] && grep -qE '^RAUN[0-9]+ *\|' src/Raun.Generator/AnalyzerReleases.Unshipped.md; then
            echo "::error::Stable release $tag: move the rules in AnalyzerReleases.Unshipped.md to AnalyzerReleases.Shipped.md under '## Release ${tag#v}' first."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "### Next version: \`$tag\`"
            echo "From \`main\` at \`${GITHUB_SHA::8}\`, bump \`$BUMP\`."
            if [[ "$DRY_RUN" == "true" ]]; then echo "Dry run: nothing was tagged or published."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: version
    # A tag push skips the version job; a dispatch publishes only after it, and never on a dry run.
    if: >-
      always() && (github.event_name == 'push' ||
      (needs.version.result == 'success' && !inputs.dry_run))
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # A local tag is enough for MinVer; it reaches origin only after the tests pass.
      - name: Tag the release commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          version="${TAG#v}"
          title="Raun $version"
          if [[ "$version" == *-* ]]; then
            pre="${version#*-}"
            title="Raun ${version%%-*} ${pre//./ }"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$title"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # The SDK global.json pins (.NET 11) builds both targets; net10.0 tests need the 10 runtime.
          # Exact version: the 10.0.x channel link redirects to a retired download origin (HTTP 409).
          global-json-file: global.json
          dotnet-version: 10.0.403

      - name: Restore (locked)
        run: dotnet restore Raun.slnx --locked-mode

      - name: Build
        run: dotnet build Raun.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test Raun.slnx -c Release --no-build

      - name: Report interaction tests
        run: node --test test/Raun.Test/Reporting/message-view.test.cjs test/Raun.Test/Reporting/coverage-view.test.cjs

      - name: Install report browser test tools
        working-directory: test/Browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Resource matrix browser tests
        run: |
          dotnet run --project samples/AppointmentTests/AppointmentTests.csproj -c Release --no-build -- --report-html --results-directory "$PWD/artifacts/matrix-sample"
          node test/Browser/resource-matrix.cjs "$PWD/artifacts/matrix-sample/raun-report.html"
          node test/Browser/scenario-flow.cjs "$PWD/artifacts/matrix-sample/raun-report.html"
          node test/Browser/coverage-view.cjs "$PWD/artifacts/matrix-sample/raun-report.html"
          node test/Browser/scenario-tags.cjs "$PWD/artifacts/matrix-sample/raun-report.html"

      - name: Pack
        run: |
          dotnet pack src/Raun/Raun.csproj -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true
          dotnet pack src/Raun.Coverage/Raun.Coverage.csproj -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true
          dotnet pack src/Raun.Mtp/Raun.Mtp.csproj -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true
          dotnet pack src/Raun.Aspire/Raun.Aspire.csproj -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true
          # A non-packable project exits successfully without writing a package.
          # Catch that before publishing any part of a release.
          for package in Raun Raun.Coverage Raun.Mtp Raun.Aspire; do
            if ! compgen -G "artifacts/$package.[0-9]*.nupkg" > /dev/null; then
              echo "Missing package: $package" >&2
              exit 1
            fi
          done

      - name: Test package consumption
        run: |
          dotnet restore test/Raun.PackageTests/Raun.PackageTests.csproj --locked-mode
          dotnet build test/Raun.PackageTests/Raun.PackageTests.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true
          dotnet run --project test/Raun.PackageTests/Raun.PackageTests.csproj -c Release --no-build -- --report-html --results-directory "$PWD/artifacts/package-consumption"

      - name: Upload package consumption report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-consumption-report
          path: artifacts/package-consumption/
          if-no-files-found: ignore

      - name: Upload standalone package report
        id: package-report-html
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifacts/package-consumption/raun-report.html
          archive: false
          if-no-files-found: ignore

      - name: Link package report in run summary
        if: always() && steps.package-report-html.outputs.artifact-url != ''
        env:
          REPORT_URL: ${{ steps.package-report-html.outputs.artifact-url }}
        run: printf '[Package consumption report](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"

      # Pushed with the workflow token, which does not trigger this workflow again for the tag.
      - name: Push the tag
        if: github.event_name == 'workflow_dispatch'
        run: git push origin "refs/tags/$TAG"

      - name: NuGet.org login
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          version="${TAG#v}"
          for package in Raun Raun.Coverage Raun.Mtp Raun.Aspire; do
            dotnet nuget push "artifacts/$package.$version.nupkg" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$TAG" artifacts/*.nupkg --generate-notes "${release_flags[@]}"
