# Dependency updates, grouped so a week's bumps arrive as one reviewable PR per ecosystem rather
# than one per package. NuGet versions are centrally managed (Directory.Packages.props) and pinned
# by packages.lock.json. Dependabot edits the lock files itself but never runs a real restore, so it
# misses the per-RID lock files (packages.linux-x64.lock.json) and some transitive project entries;
# the dependabot-locks workflow regenerates every lock file on its PRs before CI's --locked-mode.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-nuget:
        patterns: ['*']
    ignore:
      # MSBuild 18.10+ targets .NET 11. Raun.Coverage still ships for net10.0, where it loads a .NET 10
      # SDK's MSBuild, so it compiles against the last .NET 10 MSBuild. Bump when net10.0 is dropped.
      - dependency-name: Microsoft.Build.Framework
        versions: ['>= 18.10']
      - dependency-name: Microsoft.NET.StringTools
        versions: ['>= 18.10']
      # Roslyn moves by hand. The generator builds against RaunRoslynVersion whatever the central
      # version says, but Raun.Coverage ships the Workspaces packages as dependencies, and a consumer
      # pinning Roslyn packages sees every bump.
      - dependency-name: Microsoft.CodeAnalysis*
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # The net10.0 libraries must depend on 10.x: an 11.x dependency fails restore (NU1109) for a
      # .NET 10 consumer pinning transitive packages. Lift when net10.0 is dropped.
      - dependency-name: Microsoft.Extensions.*
        update-types: ['version-update:semver-major']
      # A security pin for a transitive dependency of StreamJsonRpc, which is built against 2.x.
      - dependency-name: MessagePack
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all-actions:
        patterns: ['*']
